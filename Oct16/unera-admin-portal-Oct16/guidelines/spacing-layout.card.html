<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-body);color:var(--text-primary);background:#fff;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}.sw i{display:block;height:44px;border-radius:8px;border:1px solid var(--line)}.sw b{font-weight:600;font-size:12px}.sw span{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}</style></head><body><div style="display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:150px"><div style="width:90px;background:var(--brand-deep-blue);padding:10px;color:#fff;font-size:10px">sidebar<div style="margin-top:8px;height:18px;border-radius:4px;background:var(--chrome-active);border-left:2px solid var(--brand-yellow)"></div><div style="margin-top:4px;height:18px;border-radius:4px;background:var(--chrome-hover)"></div></div><div style="flex:1;background:var(--canvas)"><div style="height:24px;background:#fff;border-bottom:1px solid var(--line);font-size:10px;padding:6px 10px;color:var(--text-secondary)">top bar · global search · role</div><div style="padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div style="height:36px;background:#fff;border:1px solid var(--line);border-radius:6px"></div><div style="height:36px;background:#fff;border:1px solid var(--line);border-radius:6px"></div><div style="height:36px;background:#fff;border:1px solid var(--line);border-radius:6px"></div><div style="grid-column:1/4;height:50px;background:#fff;border:1px solid var(--line);border-radius:6px"></div></div></div></div></body></html>
