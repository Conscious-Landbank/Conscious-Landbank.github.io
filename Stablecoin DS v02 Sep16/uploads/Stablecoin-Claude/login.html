<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — UNERA Stablecoin</title>

    <style>
        /* ── TestFoundersGrotesk — UNERA V2 brand font ─────────────────────────── */
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../../Brand Guide/TestFoundersGrotesk-Light.otf") format('opentype'); font-weight:300; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../../Brand Guide/TestFoundersGrotesk-LightItalic.otf") format('opentype'); font-weight:300; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../../Brand Guide/TestFoundersGrotesk-Regular.otf") format('opentype'); font-weight:400; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../../Brand Guide/TestFoundersGrotesk-RegularItalic.otf") format('opentype'); font-weight:400; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../../Brand Guide/TestFoundersGrotesk-Medium.otf") format('opentype'); font-weight:500; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../../Brand Guide/TestFoundersGrotesk-MediumItalic.otf") format('opentype'); font-weight:500; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../../Brand Guide/TestFoundersGrotesk-Semibold.otf") format('opentype'); font-weight:600; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../../Brand Guide/TestFoundersGrotesk-SemiboldItalic.otf") format('opentype'); font-weight:600; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../../Brand Guide/TestFoundersGrotesk-Bold.otf") format('opentype'); font-weight:700; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../../Brand Guide/TestFoundersGrotesk-BoldItalic.otf") format('opentype'); font-weight:700; font-style:italic; font-display:swap; }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --brand-deep-blue:   #173d47;
            --brand-yellow:      #ffffab;
            --brand-cloud-blue:  #ebfcf5;
            --brand-earth:       #cec4b8;
            --brand-black:       #000000;
            --brand-white:       #ffffff;
            --brand-red:         #ab5770;
            --brand-purple:      #6a5770;
            --brand-light-blue:  #90c2b8;

            --primary-green:     #173d47;
            --primary-blue:      #90c2b8;
            --accent-pink:       #ffffab;
            --neutral-900:       #173d47;
            --neutral-800:       #1e4e5a;
            --neutral-700:       #2e6374;
            --neutral-600:       #3d6b78;
            --neutral-500:       #90c2b8;
            --neutral-400:       #b8d1d6;
            --neutral-300:       #d8ecee;
            --neutral-200:       #e8f5f6;
            --neutral-100:       #f3fafb;
            --neutral-50:        #ffffff;

            --gradient-primary:  var(--brand-deep-blue);
            --gradient-sky:      color-mix(in srgb, var(--brand-cloud-blue) 50%, var(--brand-white));
            --gradient-warm:     color-mix(in srgb, var(--brand-yellow) 30%, var(--brand-white));
            --gradient-deep:     var(--brand-deep-blue);
            --gradient-ink:      var(--brand-deep-blue);
            --gradient-dusk:     var(--brand-deep-blue);

            --font-display:      'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif;
            --font-body:         'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif;

            --fin-up:            #1a7a5e;
            --fin-up-bg:         color-mix(in srgb, var(--fin-up) 12%, var(--brand-white));
            --fin-down:          var(--brand-red);
            --fin-down-bg:       color-mix(in srgb, var(--brand-red) 12%, var(--brand-white));
            --fin-neutral:       #6b9090;
            --fin-neutral-bg:    rgba(107, 144, 144, 0.10);

            --success:           var(--fin-up);
            --warning:           #b8a030;
            --error:             var(--brand-red);
            --error-bg:          rgba(171, 87, 112, 0.10);

            --text-primary:      #173d47;
            --text-secondary:    #3d6b78;
            --border-subtle:     rgba(23, 61, 71, 0.13);
            --shadow-card:       0 2px 12px rgba(23, 61, 71, 0.07);

            --surface-impact:    color-mix(in srgb, var(--brand-cloud-blue) 22%, var(--brand-white));
            --surface-action:    color-mix(in srgb, var(--brand-cloud-blue) 14%, var(--brand-white));
            --surface-warm:      color-mix(in srgb, var(--brand-earth) 12%, var(--brand-white));
            --surface-sky:       color-mix(in srgb, var(--brand-cloud-blue) 18%, var(--brand-white));
            --surface-deep:      color-mix(in srgb, var(--brand-deep-blue) 4%, var(--brand-white));
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ── Skip Link ───────────────────────────────────────────── */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--brand-deep-blue);
            color: var(--brand-white);
            padding: 8px 16px;
            text-decoration: none;
            z-index: 10000;
            border-radius: 0 0 8px 0;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.875rem;
        }
        .skip-link:focus { top: 0; outline: 3px solid var(--brand-yellow); }

        /* ── Layout ──────────────────────────────────────────────── */
        body {
            font-family: var(--font-body);
            background: var(--brand-cloud-blue);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Auth page header (pre-login, not app nav) ───────────── */
        .header {
            background: var(--brand-deep-blue);
            padding: 0 2rem;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .nav-logo-img {
            height: 24px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            object-position: left center;
            display: block;
        }

        /* hide V1 logo elements — replaced by SVG img */
        .logo-icon,
        .logo-text { display: none; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            transition: color 0.2s, background 0.2s;
            font-family: var(--font-body);
        }
        .back-btn:hover { color: var(--brand-yellow); background: rgba(255, 255, 255, 0.08); }
        .back-btn:focus { outline: 2px solid var(--brand-yellow); outline-offset: 2px; }
        .back-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

        /* ── Main auth container ─────────────────────────────────── */
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
        }

        /* ── Auth card (widget-card pattern) ─────────────────────── */
        .auth-card {
            background: var(--brand-white);
            border: 1px solid var(--border-subtle);
            border-radius: 1.25rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow-card);
        }

        /* ── Auth header within card ─────────────────────────────── */
        .auth-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-badge {
            width: 56px;
            height: 56px;
            border-radius: 1rem;
            background: var(--brand-deep-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            color: var(--brand-white);
        }

        .auth-title {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--brand-deep-blue);
            margin-bottom: 0.25rem;
            line-height: 1.2;
        }

        .auth-subtitle {
            font-size: 0.9375rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ── Trust bar ───────────────────────────────────────────── */
        .trust-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem 0.75rem;
            margin-bottom: 1.75rem;
            padding: 0.875rem 1rem;
            background: color-mix(in srgb, var(--brand-cloud-blue) 60%, var(--brand-white));
            border-radius: 0.75rem;
            border: 1px solid var(--border-subtle);
        }

        .trust-item {
            display: inline-flex;
            align-items: center;
            gap: 0.3125rem;
            font-size: 0.8125rem;
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
        }

        .trust-item svg {
            width: 13px;
            height: 13px;
            color: var(--brand-deep-blue);
            flex-shrink: 0;
        }

        .trust-divider {
            color: var(--border-subtle);
            font-size: 0.75rem;
            line-height: 1;
        }

        /* ── Form ────────────────────────────────────────────────── */
        .auth-form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.4375rem;
            font-family: var(--font-body);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border-subtle);
            border-radius: 0.75rem;
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--text-primary);
            background: var(--brand-white);
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--brand-deep-blue);
            box-shadow: 0 0 0 3px rgba(23, 61, 71, 0.10);
        }

        .form-input.invalid {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(171, 87, 112, 0.10);
        }

        .form-input.valid {
            border-color: var(--fin-up);
        }

        .form-hint {
            display: block;
            font-size: 0.8125rem;
            color: var(--text-secondary);
            margin-top: 0.375rem;
            font-family: var(--font-body);
        }

        .error-message {
            font-size: 0.8125rem;
            color: var(--error);
            margin-top: 0.375rem;
            display: none;
            align-items: center;
            gap: 0.25rem;
            font-family: var(--font-body);
        }

        /* ── Password wrapper ────────────────────────────────────── */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-input {
            padding-right: 3rem;
        }

        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.25rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            transition: color 0.2s;
            line-height: 0;
        }

        .password-toggle:hover { color: var(--text-primary); }
        .password-toggle:focus { outline: 2px solid var(--brand-deep-blue); outline-offset: 2px; }

        /* ── Primary CTA button ──────────────────────────────────── */
        .submit-btn {
            width: 100%;
            min-height: 46px;
            padding: 0.875rem 1.5rem;
            background: var(--brand-deep-blue);
            color: var(--brand-white);
            border: none;
            border-radius: 0.75rem;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--neutral-800);
            box-shadow: 0 4px 14px rgba(23, 61, 71, 0.35);
            transform: translateY(-1px);
        }

        .submit-btn:active:not(:disabled) { transform: translateY(0); }

        .submit-btn:focus {
            outline: 3px solid rgba(23, 61, 71, 0.30);
            outline-offset: 2px;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .submit-btn.loading {
            opacity: 0.75;
            cursor: wait;
        }

        .submit-btn.loading::after {
            content: '';
            position: absolute;
            right: 1.125rem;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.40);
            border-top-color: var(--brand-white);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .submit-btn.success {
            background: var(--fin-up);
        }

        @keyframes spin {
            to { transform: translateY(-50%) rotate(360deg); }
        }

        /* sticky on mobile */
        @media (max-width: 480px) {
            .submit-btn.sticky-cta {
                position: sticky;
                bottom: 1rem;
                z-index: 10;
                box-shadow: 0 4px 16px rgba(23, 61, 71, 0.30);
            }
        }

        /* ── Remember / forgot row ───────────────────────────────── */
        .remember-forgot-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-input {
            width: 16px;
            height: 16px;
            accent-color: var(--brand-deep-blue);
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            font-family: var(--font-body);
        }

        .auth-link {
            font-size: 0.875rem;
            color: var(--brand-deep-blue);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
            font-family: var(--font-body);
        }

        .auth-link:hover { opacity: 0.70; text-decoration: underline; }
        .auth-link:focus { outline: 2px solid var(--brand-deep-blue); outline-offset: 2px; border-radius: 2px; }

        /* ── Sign-up / login link ────────────────────────────────── */
        .login-link {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-family: var(--font-body);
        }

        .login-link a {
            color: var(--brand-deep-blue);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .login-link a:hover { opacity: 0.70; text-decoration: underline; }
        .login-link a:focus { outline: 2px solid var(--brand-deep-blue); outline-offset: 2px; border-radius: 2px; }

        /* ── Notification modal ──────────────────────────────────── */
        body.modal-open { overflow: hidden; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10010;
            padding: 1rem;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .modal {
            background: var(--brand-white);
            border-radius: 1.25rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            max-width: 440px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 1.5rem 1rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--brand-deep-blue);
            margin: 0;
        }

        .modal-close-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.375rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            transition: background 0.2s;
            color: var(--text-secondary);
            line-height: 0;
        }

        .modal-close-btn:hover { background: color-mix(in srgb, var(--brand-cloud-blue) 60%, var(--brand-white)); }
        .modal-close-btn:focus { outline: 2px solid var(--brand-deep-blue); outline-offset: 2px; }

        .modal-body {
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .notification-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--brand-deep-blue);
            color: var(--brand-white);
        }

        .notification-icon.error {
            background: var(--brand-red);
            color: var(--brand-white);
        }

        .notification-icon.warning {
            background: color-mix(in srgb, var(--brand-yellow) 55%, var(--brand-earth));
            color: var(--brand-deep-blue);
        }

        .notification-message {
            font-size: 0.9375rem;
            line-height: 1.65;
            color: var(--text-secondary);
            margin: 0;
            font-family: var(--font-body);
        }

        .modal-footer {
            padding: 0 1.5rem 1.5rem;
            display: flex;
            gap: 0.75rem;
        }

        .modal-footer .btn-primary {
            flex: 1;
            padding: 0.875rem 1.5rem;
            border-radius: 0.75rem;
            font-family: var(--font-body);
            font-size: 0.9375rem;
            font-weight: 600;
            background: var(--brand-deep-blue);
            color: var(--brand-white);
            border: none;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            min-height: 46px;
        }

        .modal-footer .btn-primary:hover {
            background: var(--neutral-800);
            box-shadow: 0 4px 12px rgba(23, 61, 71, 0.30);
        }

        .modal-footer .btn-primary:focus {
            outline: 3px solid rgba(23, 61, 71, 0.30);
            outline-offset: 2px;
        }

        /* ── Responsive ──────────────────────────────────────────── */
        @media (max-width: 768px) {
            .header {
                height: 52px;
                padding: 0 1.25rem;
            }

            .auth-container {
                padding: 1.5rem 1rem;
                align-items: flex-start;
                padding-bottom: 3rem;
            }

            .auth-card {
                padding: 1.75rem 1.5rem;
            }

            .remember-forgot-wrapper {
                flex-direction: row;
                align-items: center;
            }

            .modal {
                max-width: 100%;
                border-radius: 1rem;
            }

            .modal-header { padding: 1.25rem 1.25rem 0.75rem; }
            .modal-body   { padding: 1.5rem 1.25rem; }
            .modal-footer { padding: 0 1.25rem 1.25rem; }

            .notification-icon { width: 56px; height: 56px; }
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 1.5rem 1.25rem;
            }

            .auth-title {
                font-size: 1.5rem;
            }

            .form-input,
            select.form-input {
                font-size: 1rem; /* prevent iOS zoom */
            }

            .trust-bar {
                gap: 0.375rem 0.5rem;
            }
        }
    
        /* Stablecoin app context pill */
        .app-pill {
            background: var(--brand-cloud-blue);
            color: var(--brand-deep-blue);
            font-size: 0.625rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.125rem 0.5rem;
            border-radius: 980px;
            white-space: nowrap;
        }
        
        .sso-section { margin-bottom: 1.5rem; }
        .btn-sso {
            display: flex;
            width: 100%;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 1.5rem;
            background: var(--brand-deep-blue);
            color: var(--brand-white);
            border: none;
            border-radius: 0.75rem;
            font-size: 0.938rem;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            text-decoration: none;
            min-height: 46px;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .btn-sso:hover { background: var(--neutral-800); box-shadow: 0 4px 14px rgba(23,61,71,0.3); }
        .btn-sso:focus { outline: 3px solid var(--brand-deep-blue); outline-offset: 2px; }
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.25rem 0;
            color: var(--text-secondary);
            font-size: 0.813rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }
        </style>
</head>
<body>
    <!-- Skip Link for Accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <!-- V2 UNERA wordmark (white, for dark header) -->
            <a href="dashboard.html" style="display:flex;align-items:center;text-decoration:none;" aria-label="UNERA home">
                <img src="../NewLogo/Unera White Text Nav.svg" alt="UNERA" class="nav-logo-img" height="24">
                <span class="app-pill" aria-label="UNERA Stablecoin app">STABLECOIN</span>
            </a>
            <!-- V1 logo elements kept for DOM parity but visually hidden -->

    <!-- Custom Notification Modal -->
    <div id="notificationModal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="notificationTitle">

            <div class="modal-header">
                <h2 id="notificationTitle" class="modal-title">Notification</h2>
                <button class="modal-close-btn" onclick="closeNotificationModal()" aria-label="Close notification">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

                </button>
            </div>
            <div class="modal-body">

                        <path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <p class="notification-message" id="notificationMessage"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="closeNotificationModal()" style="width: 100%;">OK</button>
            </div>
        </div>
    </div>

    <!-- JavaScript (all behavior preserved from login_2.html) -->
    <script>
        // Custom Notification Modal
        function showNotification(message, type = 'info', title = 'Notification') {
            const modal = document.getElementById('notificationModal');
            const icon = document.getElementById('notificationIcon');
            const messageEl = document.getElementById('notificationMessage');
            const titleEl = document.getElementById('notificationTitle');
            
            // Update content
            titleEl.textContent = title;
            messageEl.textContent = message;
            
            // Update icon based on type
            icon.className = 'notification-icon';
            if (type === 'error') {
                icon.classList.add('error');
            } else if (type === 'warning') {
                icon.classList.add('warning');
            }
            
            // Show modal
            modal.style.display = 'flex';
            document.body.classList.add('modal-open');
            
            // Focus on close button for accessibility
            setTimeout(() => {
                document.querySelector('.modal-close-btn').focus();
            }, 100);
        }

        function closeNotificationModal() {
            const modal = document.getElementById('notificationModal');
            modal.style.display = 'none';
            document.body.classList.remove('modal-open');
        }

        // Close modal on ESC key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeNotificationModal();
            }
        });

        // Close modal on overlay click
        document.getElementById('notificationModal')?.addEventListener('click', function(e) {
            if (e.target === this) {
                closeNotificationModal();
            }
        });

        // Password toggle
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const eyeOpen = document.getElementById('eyeOpen');
            const eyeClosed = document.getElementById('eyeClosed');
            
            if (field.type === 'password') {
                field.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                field.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        }

        // Form validation
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');

        // Real-time email validation
        emailInput.addEventListener('blur', function() {
            validateEmail(this);
        });

        emailInput.addEventListener('input', function() {
            // Clear error on input
            if (this.classList.contains('invalid')) {
                this.classList.remove('invalid');
                document.getElementById('emailError').style.display = 'none';
            }
        });

        // Real-time password validation
        passwordInput.addEventListener('input', function() {
            if (this.classList.contains('invalid')) {
                this.classList.remove('invalid');
                document.getElementById('passwordError').style.display = 'none';
            }
        });

        // Validate email
        function validateEmail(input) {
            const email = input.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const errorDiv = document.getElementById('emailError');
            
            if (!email) {
                input.classList.add('invalid');
                input.classList.remove('valid');
                errorDiv.textContent = 'Email is required';
                errorDiv.style.display = 'flex';
                return false;
            } else if (!emailRegex.test(email)) {
                input.classList.add('invalid');
                input.classList.remove('valid');
                errorDiv.textContent = 'Please enter a valid email address';
                errorDiv.style.display = 'flex';
                return false;
            } else {
                input.classList.remove('invalid');
                input.classList.add('valid');
                errorDiv.style.display = 'none';
                return true;
            }
        }

        // Form submission
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validate all fields
            const emailValid = validateEmail(emailInput);
            
            if (!passwordInput.value) {
                passwordInput.classList.add('invalid');
                document.getElementById('passwordError').textContent = 'Password is required';
                document.getElementById('passwordError').style.display = 'flex';
                return;
            }
            
            if (!emailValid) {
                return;
            }
            
            // Show loading state
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            
            // Simulate API call
            try {
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Check if email is verified
                // In production, this would be checked on the backend
                const emailVerified = localStorage.getItem('emailVerified') === 'true';
                const userEmail = emailInput.value.trim();
                
                // DEMO MODE: Skip email verification for local testing
                // Remove this in production when backend email verification is implemented
                const isDemoMode = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                
                if (!emailVerified && !isDemoMode) {
                    // Email not verified - resend code and redirect to verification
                    console.log('⚠️ Email not verified - sending new verification code');
                    
                    loginBtn.classList.remove('loading');
                    loginBtn.textContent = 'Sending Code...';
                    
                    // Simulate sending verification code
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    // Store email and redirect to verification
                    localStorage.setItem('signupEmail', userEmail);
                    localStorage.setItem('loginAttemptEmail', userEmail);
                    
                    showNotification(
                        'Your email is not verified. We\'ve sent you a new verification code. Please check your email.',
                        'warning',
                        'Email Verification Required'
                    );
                    
                    // Redirect to email verification after modal closes
                    setTimeout(() => {
                        window.location.href = `verify-email.html?email=${encodeURIComponent(userEmail)}&from=login`;
                    }, 2000);
                    return;
                }
                
                // Success - credentials valid and email verified
                loginBtn.classList.remove('loading');
                loginBtn.classList.add('success');
                loginBtn.textContent = 'Success!';
                
                // Haptic feedback (mobile)
                if (window.navigator.vibrate) {
                    window.navigator.vibrate([10, 50, 10]);
                }
                
                // Store login state
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('loginTimestamp', new Date().toISOString());
                localStorage.setItem('signupEmail', userEmail);
                
                // Set email as verified in demo mode to prevent future verification prompts
                if (isDemoMode && !emailVerified) {
                    localStorage.setItem('emailVerified', 'true');
                }
                
                // Check if 2FA is enabled
                setTimeout(() => {
                    const twoFAEnabled = localStorage.getItem('2faEnabled') === 'true';
                    const deviceTrusted = localStorage.getItem('deviceTrusted') === 'true';
                    const trustExpiry = parseInt(localStorage.getItem('deviceTrustedUntil')) || 0;
                    
                    if (twoFAEnabled && (!deviceTrusted || Date.now() > trustExpiry)) {
                        // Redirect to 2FA verification
                        console.log('🔒 2FA required - redirecting to verification');
                        window.location.href = 'verify-2fa.html';
                    } else {
                        // No 2FA or device trusted - go to dashboard
                        console.log('✅ Login successful - going to dashboard');
                        window.location.href = 'dashboard.html';
                    }
                }, 1000);
                
            } catch (error) {
                // Error handling
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
                showNotification(
                    'Login failed. Please check your credentials and try again.',
                    'error',
                    'Login Failed'
                );
                
                // Error haptic
                if (window.navigator.vibrate) {
                    window.navigator.vibrate([10, 100, 10, 100, 10]);
                }
            }
        });

        // Wallet connect
        async function connectWallet(button, walletType) {
            const walletNames = {
                metamask: 'MetaMask',
                walletconnect: 'WalletConnect',
                coinbase: 'Coinbase Wallet'
            };
            
            button.classList.add('loading');
            button.disabled = true;
            
            try {
                // Simulate wallet connection
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                console.log(`${walletNames[walletType]} connected!`);
                window.location.href = 'dashboard.html';
                
            } catch (error) {
                button.classList.remove('loading');
                button.disabled = false;
                showNotification(
                    `Failed to connect to ${walletNames[walletType]}. Please try again.`,
                    'error',
                    'Connection Failed'
                );
            }
        }

        // Social login
        async function socialLogin(button, provider) {
            const providerNames = {
                google: 'Google',
                apple: 'Apple',
                microsoft: 'Microsoft'
            };
            
            button.classList.add('loading');
            button.disabled = true;
            
            try {
                // Simulate social login
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                console.log(`Logged in with ${providerNames[provider]}!`);
                window.location.href = 'dashboard.html';
                
            } catch (error) {
                button.classList.remove('loading');
                button.disabled = false;
                showNotification(
                    `Failed to login with ${providerNames[provider]}. Please try again.`,
                    'error',
                    'Login Failed'
                );
            }
        }
    </script>
