<!-- @dsCard group="Components" viewport="700x420" subtitle="Input · Select · Checkbox / radio" name="Forms" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{padding:24px;background:#fff;color:var(--text-primary)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .lbl{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:10px}
  .stack{display:flex;flex-direction:column;gap:14px}
  @media(max-width:560px){.cols{grid-template-columns:1fr}}
</style></head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" data-presets="react">
    const NS = window[Object.keys(window).find(k => window[k] && window[k].Input && window[k].Select)] || {};
    const { Input, Select, Checkbox } = NS;
    function Demo(){
      return (
        <div className="cols">
          <div>
            <div className="lbl">Input</div>
            <div className="stack">
              <Input label="Email" type="email" placeholder="you@unera.io" />
              <Input label="Amount" prefix="$" suffix="hCAD" defaultValue="250.00" inputMode="decimal" hint="Min $10" />
              <Input label="Wallet address" defaultValue="0xZZ9" error="Invalid address" />
            </div>
          </div>
          <div>
            <div className="lbl">Select</div>
            <div className="stack">
              <Select label="Network" options={["Ethereum","Polygon","Arbitrum"]} defaultValue="Ethereum" />
              <Select label="Pay with" options={[{value:'interac',label:'INTERAC e-Transfer'},{value:'card',label:'Debit / credit card'},{value:'crypto',label:'Crypto'}]} defaultValue="interac" />
            </div>
            <div className="lbl" style={{marginTop:18}}>Checkbox / radio</div>
            <div className="stack">
              <Checkbox type="radio" name="rail" label="Standard transfer" sublabel="1–2 business days · free" defaultChecked />
              <Checkbox label="I accept the terms" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body></html>
