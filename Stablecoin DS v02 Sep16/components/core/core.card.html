<!-- @dsCard group="Components" viewport="700x440" subtitle="Button · Badge · StatusPill · Card · Stepper" name="Core" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{padding:24px;background:#fff;color:var(--text-primary)}
  .grp{margin-bottom:22px}
  .lbl{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:10px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .deep{background:var(--brand-deep-blue);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center}
</style></head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" data-presets="react">
    const NS = window.__DS__ || window[Object.keys(window).find(k => window[k] && window[k].Button && window[k].Stepper)] || {};
    const { Button, Badge, StatusPill, Card, Stepper } = NS;
    function Demo(){
      return (
        <>
          <div className="grp">
            <div className="lbl">Button</div>
            <div className="row">
              <Button variant="primary">Continue</Button>
              <Button variant="secondary">Cancel</Button>
              <Button variant="ghost">Learn more</Button>
              <Button variant="primary" disabled>Disabled</Button>
            </div>
            <div className="row" style={{marginTop:12}}>
              <div className="deep">
                <Button variant="accent">Purchase UNERA CAD</Button>
                <span style={{color:'#fff',fontSize:'.75rem',opacity:.7}}>accent = Reserve Gold, dark surfaces only</span>
              </div>
            </div>
          </div>
          <div className="grp">
            <div className="lbl">Badge &amp; StatusPill</div>
            <div className="row">
              <Badge variant="up">+250.00 hCAD</Badge>
              <Badge variant="down">−100.00 hCAD</Badge>
              <Badge variant="verify">Verified on-chain</Badge>
              <Badge variant="reserve">Fully backed</Badge>
              <StatusPill status="completed" />
              <StatusPill status="pending" />
              <StatusPill status="failed" />
              <StatusPill status="operational" dot />
            </div>
          </div>
          <div className="grp">
            <div className="lbl">Card</div>
            <div className="row" style={{alignItems:'stretch'}}>
              <Card surface="reserve" interactive style={{flex:1,minWidth:180}}>
                <div style={{fontSize:'.72rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--text-secondary)'}}>Reserve ratio</div>
                <div style={{fontFamily:'var(--font-display)',fontSize:'2rem',fontWeight:700,color:'var(--fin-up)'}}>105.2%</div>
              </Card>
              <Card surface="deep" style={{flex:1,minWidth:180}}>
                <div style={{fontSize:'.72rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',opacity:.75}}>My UNERA CAD</div>
                <div style={{fontFamily:'var(--font-display)',fontSize:'2rem',fontWeight:700}}>1,250.00</div>
              </Card>
            </div>
          </div>
          <div className="grp" style={{marginBottom:0}}>
            <div className="lbl">Stepper</div>
            <Stepper steps={["Amount","Pay","Review","Done"]} current={2} />
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body></html>
