<!-- @dsCard group="Colors" viewport="700x210" subtitle="Reserve asset classes — fixed colors on the PoR composition bar" name="Proof-of-Reserve composition" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{padding:22px;background:#fff}
  .bar{display:flex;height:16px;border-radius:980px;overflow:hidden;gap:2px;margin-bottom:16px}
  .legend{display:flex;gap:14px;flex-wrap:wrap}
  .item{display:flex;align-items:center;gap:8px;min-width:150px}
  .key{width:14px;height:14px;border-radius:4px;flex-shrink:0}
  .lbl{font-size:.78rem;font-weight:600;color:var(--text-primary)}
  .pct{font-size:.72rem;color:var(--text-secondary);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="bar">
    <div style="flex:60;background:var(--por-bank)"></div>
    <div style="flex:30;background:var(--por-stable)"></div>
    <div style="flex:8;background:var(--por-treasury)"></div>
    <div style="flex:2;background:var(--por-cash)"></div>
  </div>
  <div class="legend">
    <div class="item"><span class="key" style="background:var(--por-bank)"></span><div><div class="lbl">Bank deposits</div><div class="pct">60% · #1a7a5e</div></div></div>
    <div class="item"><span class="key" style="background:var(--por-stable)"></span><div><div class="lbl">Stablecoins</div><div class="pct">30% · #2e5f6a</div></div></div>
    <div class="item"><span class="key" style="background:var(--por-treasury)"></span><div><div class="lbl">Treasury bonds</div><div class="pct">8% · #6a5770</div></div></div>
    <div class="item"><span class="key" style="background:var(--por-cash)"></span><div><div class="lbl">Cash equivalent</div><div class="pct">2% · #b8a030</div></div></div>
  </div>
</body></html>
