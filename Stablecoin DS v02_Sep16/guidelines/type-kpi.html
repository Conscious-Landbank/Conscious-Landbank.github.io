<!-- @dsCard group="Type" viewport="700x150" subtitle="KPI figures — tabular numerals, Deep Blue ink" name="Financial figures" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{padding:24px;background:#fff;display:flex;gap:40px;flex-wrap:wrap;align-items:flex-end}
  .kpi .lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:6px}
  .kpi .val{font-family:var(--font-display);font-size:2.5rem;font-weight:700;color:var(--text-primary);line-height:1;font-variant-numeric:tabular-nums}
  .kpi .cur{font-size:1.1rem;font-weight:600;color:var(--text-secondary)}
</style></head>
<body>
  <div class="kpi"><div class="lbl">Circulating supply</div><div class="val">2,845,290 <span class="cur">hCAD</span></div></div>
  <div class="kpi"><div class="lbl">Reserve ratio</div><div class="val" style="color:var(--fin-up)">105.2%</div></div>
  <div class="kpi"><div class="lbl">My balance</div><div class="val">1,250.00</div></div>
</body></html>
