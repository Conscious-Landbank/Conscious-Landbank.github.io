<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Toned-down radii — crisper, more institutional" name="Radii" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{padding:24px;background:#fff;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
  .item{text-align:center}
  .box{width:74px;height:74px;background:var(--surface-impact);border:1.5px solid var(--brand-deep-blue);margin-bottom:8px}
  .nm{font-size:.7rem;color:var(--text-secondary);font-weight:600}
</style></head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="nm">sm · 4</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="nm">md · 6 (btn)</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="nm">lg · 8 (input)</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="nm">xl · 10</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="nm">2xl · 14 (card)</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="nm">pill</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-full)"></div><div class="nm">full</div></div>
</body></html>
