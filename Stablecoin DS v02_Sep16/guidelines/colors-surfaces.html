<!-- @dsCard group="Colors" viewport="700x180" subtitle="White-canvas card tints — subtle color-mix, never rainbow" name="Surface tints" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{padding:22px;background:var(--brand-cloud-blue)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1;min-width:120px;border-radius:14px;border:1px solid var(--border-subtle);padding:16px 14px;min-height:78px;display:flex;align-items:flex-end}
  .nm{font-size:.72rem;font-weight:600;color:var(--text-primary)}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--surface-impact)"><span class="nm">impact</span></div>
    <div class="sw" style="background:var(--surface-cad-hub)"><span class="nm">cad-hub</span></div>
    <div class="sw" style="background:var(--surface-reserve)"><span class="nm">reserve</span></div>
    <div class="sw" style="background:var(--surface-verify)"><span class="nm">verify</span></div>
    <div class="sw" style="background:var(--surface-warm)"><span class="nm">warm</span></div>
    <div class="sw" style="background:var(--surface-sky)"><span class="nm">sky</span></div>
  </div>
</body></html>
