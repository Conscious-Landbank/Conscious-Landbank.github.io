<main id="main-content" class="auth-container">
        <div class="auth-card">
            <!-- STEP 1: EMAIL ENTRY (Default view) -->
            <div id="stepEmail" class="signup-step">
                <div class="auth-header">
                    <div class="logo-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                    </div>
                    <h1 class="auth-title">Join UNERA</h1>
                    <!-- <p class="auth-subtitle">Step 1 of 3 • Start your impact journey</p> -->
                </div>

                <!-- Trust Bar -->
                <div class="trust-bar">
                    <span class="trust-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="5" y="11" width="14" height="10" rx="2"/>
                            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                        </svg>
                        Bank-level encryption
                    </span>
                    <span class="trust-divider">•</span>
                    <span class="trust-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        100K+ members
                    </span>
                    <span class="trust-divider">•</span>
                    <span class="trust-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        Free forever
                    </span>
                </div>

                <!-- Email & Password Form -->
                <form class="auth-form" id="emailForm" novalidate>
                    <!-- Email Field -->
                    <div class="form-group">
                        <label for="emailInput" class="form-label">Email Address</label>
                        <input 
                            type="email" 
                            id="emailInput" 
                            class="form-input"
                            placeholder="your@email.com"
                            autocomplete="email"
                            autocapitalize="off"
                            autocorrect="off"
                            spellcheck="false"
                            required
                            autofocus
                        >
                        <div class="error-message" id="emailError" style="display: none;"></div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="signupPasswordStep1" class="form-label">Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="signupPasswordStep1" 
                                class="form-input"
                                placeholder="Create a strong password"
                                autocomplete="new-password"
                                required
                            >
                            <button 
                                type="button" 
                                class="password-toggle" 
                                onclick="togglePasswordStep1('signupPasswordStep1')"
                                aria-label="Toggle password visibility"
                            >
                                <svg class="eye-open-step1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-closed-step1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="form-hint">At least 8 characters with numbers and symbols</span>
                        <div class="error-message" id="passwordStep1Error" style="display: none;"></div>
                    </div>

                    <button type="submit" class="submit-btn sticky-cta" id="continueEmailBtn">
                        Continue
                    </button>
                </form>

                <!-- Login Link -->
                <div class="login-link">
                    Already have an account? <a href="login_2.html">Log in</a>
                </div>
            </div>

            <!-- STEP 3: COMPLETE YOUR PROFILE (After email verification) -->
            <div id="stepDetails" class="signup-step" style="display: none;">
                <div class="auth-header">
                    <div class="logo-badge" style="background: linear-gradient(135deg, #10B981 0%, #0EA5E9 100%);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <h1 class="auth-title">Complete Your Profile</h1>
                    <!-- <p class="auth-subtitle" style="color: var(--primary-green);">
                        ✓ Email verified • Step 3 of 3
                    </p> -->
                </div>

                <!-- Personal Details Form -->
                <form class="auth-form" id="detailsForm" novalidate>
                    <!-- First Name -->
                    <div class="form-group">
                        <label for="firstName" class="form-label">First Name</label>
                        <input 
                            type="text" 
                            id="firstName" 
                            class="form-input"
                            placeholder="John"
                            autocomplete="given-name"
                            required
                        >
                        <span class="form-hint">Must match your government-issued ID</span>
                        <div class="error-message" id="firstNameError" style="display: none;"></div>
                    </div>

                    <!-- Last Name -->
                    <div class="form-group">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input 
                            type="text" 
                            id="lastName" 
                            class="form-input"
                            placeholder="Doe"
                            autocomplete="family-name"
                            required
                        >
                        <span class="form-hint">Must match your government-issued ID</span>
                        <div class="error-message" id="lastNameError" style="display: none;"></div>
                    </div>

                    <!-- Country of Residence -->
                    <div class="form-group">
                        <label for="country" class="form-label">Country of Residence</label>
                        <select 
                            id="country" 
                            class="form-input"
                            autocomplete="country"
                            required
                        >
                            <option value="">Select your country</option>
                            <option value="US">United States</option>
                            <option value="GB">United Kingdom</option>
                            <option value="CA">Canada</option>
                            <option value="AU">Australia</option>
                            <option value="DE">Germany</option>
                            <option value="FR">France</option>
                            <option value="IT">Italy</option>
                            <option value="ES">Spain</option>
                            <option value="NL">Netherlands</option>
                            <option value="BE">Belgium</option>
                            <option value="SE">Sweden</option>
                            <option value="NO">Norway</option>
                            <option value="DK">Denmark</option>
                            <option value="FI">Finland</option>
                            <option value="IE">Ireland</option>
                            <option value="AT">Austria</option>
                            <option value="CH">Switzerland</option>
                            <option value="PT">Portugal</option>
                            <option value="GR">Greece</option>
                            <option value="PL">Poland</option>
                            <option value="CZ">Czech Republic</option>
                            <option value="HU">Hungary</option>
                            <option value="RO">Romania</option>
                            <option value="BG">Bulgaria</option>
                            <option value="HR">Croatia</option>
                            <option value="SI">Slovenia</option>
                            <option value="SK">Slovakia</option>
                            <option value="LT">Lithuania</option>
                            <option value="LV">Latvia</option>
                            <option value="EE">Estonia</option>
                            <option value="JP">Japan</option>
                            <option value="KR">South Korea</option>
                            <option value="CN">China</option>
                            <option value="IN">India</option>
                            <option value="SG">Singapore</option>
                            <option value="MY">Malaysia</option>
                            <option value="TH">Thailand</option>
                            <option value="ID">Indonesia</option>
                            <option value="PH">Philippines</option>
                            <option value="VN">Vietnam</option>
                            <option value="NZ">New Zealand</option>
                            <option value="BR">Brazil</option>
                            <option value="MX">Mexico</option>
                            <option value="AR">Argentina</option>
                            <option value="CL">Chile</option>
                            <option value="CO">Colombia</option>
                            <option value="PE">Peru</option>
                            <option value="ZA">South Africa</option>
                            <option value="NG">Nigeria</option>
                            <option value="KE">Kenya</option>
                            <option value="EG">Egypt</option>
                            <option value="AE">United Arab Emirates</option>
                            <option value="SA">Saudi Arabia</option>
                            <option value="IL">Israel</option>
                            <option value="TR">Turkey</option>
                            <option value="RU">Russia</option>
                            <option value="UA">Ukraine</option>
                        </select>
                        <span class="form-hint">Based on your location</span>
                        <div class="error-message" id="countryError" style="display: none;"></div>
                    </div>

                    <!-- Terms -->
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" class="checkbox-input" required>
                        <label for="terms" class="checkbox-label">
                            I agree to the <a href="#" style="display: inline;" class="auth-link">Terms and Conditions</a>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn sticky-cta" id="createAccountBtn">
                        Create Account
                    </button>
                </form>

                <!-- Login Link -->
                <div class="login-link">
                    Already have an account? <a href="login_2.html">Log in</a>
