<!-- @template name="Consumer page" description="UNERA consumer app page scaffold — Deep Blue nav spine + page header + card grid, composing DS components." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNERA — New page</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<!-- Loads UNERA tokens + brand font + component bundle -->
<script src="./ds-base.js"></script>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--brand-white); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
  /* Nav spine — keep this exact, it is the product's shared chrome */
  .nav { background: var(--brand-deep-blue); height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 2.75rem; position: sticky; top: 0; z-index: 10001; }
  .nav-left { display: flex; align-items: center; gap: 1.5rem; }
  .nav-links { display: flex; gap: 1.375rem; list-style: none; }
  .nav-link { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.02em; text-transform: uppercase; padding: 0.5rem; }
  .nav-link.active { color: var(--brand-yellow); font-weight: 600; }
  .app-main { max-width: 1200px; margin: 0 auto; padding: 40px 52px 80px; }
  .page-title { font-family: var(--font-display); font-size: 3rem; font-weight: 700; color: var(--brand-deep-blue); line-height: 1.1; margin-bottom: 0.5rem; }
  .page-subtitle { font-size: 1.125rem; color: var(--text-secondary); margin-bottom: 2.5rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
  @media (max-width: 768px) { .nav-links { display: none; } .app-main { padding: 24px 18px 60px; } .page-title { font-size: 2.25rem; } }
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-left">
    <img src="../../assets/logos/unera-white-text-nav.svg" alt="UNERA" style="height:24px">
    <ul class="nav-links">
      <li><a class="nav-link active">Dashboard</a></li>
      <li><a class="nav-link">Wallet</a></li>
      <li><a class="nav-link">Transact</a></li>
      <li><a class="nav-link">Centres</a></li>
    </ul>
  </div>
</nav>
<main class="app-main">
  <h1 class="page-title">New page</h1>
  <p class="page-subtitle">One Flow. Many Lives. — start building with UNERA components below.</p>
  <div id="root"></div>
</main>
<script type="text/babel" data-presets="react">
  function mount() {
    const ns = window.UNERADesignSystem_679671;
    if (!ns) { return setTimeout(mount, 60); }
    const { Card, Button, Badge } = ns;
    function Starter() {
      return (
        <div className="grid">
          <Card surface="impact" interactive accent style={{ padding: '1.5rem' }}>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: '2.5rem', fontWeight: 700, lineHeight: 1 }}>$10,240</div>
            <div style={{ color: 'var(--text-secondary)', fontWeight: 600, margin: '0.5rem 0 0.75rem' }}>Total Portfolio</div>
            <Badge variant="up">+$2,400 this month</Badge>
          </Card>
          <Card surface="warm" interactive style={{ padding: '1.5rem' }}>
            <div style={{ fontWeight: 600, fontSize: '1.25rem', marginBottom: '0.5rem' }}>Support a centre</div>
            <p style={{ color: 'var(--text-secondary)', marginBottom: '1.25rem' }}>Your value lands where it's needed most.</p>
            <Button variant="primary">Donate</Button>
          </Card>
          <Card surface="inverse" style={{ padding: '1.5rem' }}>
            <div style={{ fontWeight: 600, fontSize: '1.25rem', marginBottom: '0.5rem' }}>Buy Stablecoins</div>
            <p style={{ opacity: 0.7, marginBottom: '1.25rem' }}>hUSD · USDC · USDT</p>
            <Button variant="accent">Get started</Button>
          </Card>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Starter />);
  }
  mount();
</script>
</body>
</html>
