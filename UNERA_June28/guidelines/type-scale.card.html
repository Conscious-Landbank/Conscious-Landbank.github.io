<!-- @dsCard group="Type" viewport="700x340" name="Type Scale" subtitle="Product type scale — page title is solid Deep Blue, no gradient text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:24px; color:var(--brand-deep-blue); }
  .row { display:flex; align-items:baseline; gap:16px; padding:7px 0; border-bottom:1px solid var(--border-subtle); }
  .row:last-child { border-bottom:none; }
  .tag { font-family:var(--font-mono); font-size:10.5px; color:var(--text-secondary); width:150px; flex-shrink:0; }
  .demo { color:var(--brand-deep-blue); font-weight:700; line-height:1.1; }
</style>
</head>
<body>
  <div class="row"><span class="tag">page-title · 48</span><span class="demo" style="font-size:3rem">Many Lives</span></div>
  <div class="row"><span class="tag">section · 28</span><span class="demo" style="font-size:1.75rem">Quick Actions</span></div>
  <div class="row"><span class="tag">card-title · 20</span><span class="demo" style="font-size:1.25rem">Total Portfolio</span></div>
  <div class="row"><span class="tag">lead · 18 (400)</span><span class="demo" style="font-size:1.125rem;font-weight:400;color:var(--text-secondary)">Track your impact and contributions</span></div>
  <div class="row"><span class="tag">body · 16 (400)</span><span class="demo" style="font-size:1rem;font-weight:400;color:var(--text-secondary)">One unified flow of value supporting many lives.</span></div>
  <div class="row"><span class="tag">sm · 14 · 2xs · 12</span><span class="demo" style="font-size:0.875rem;font-weight:400;color:var(--text-secondary)">Secondary label &nbsp;·&nbsp; <span style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.02em">NAV LINK</span></span></div>
</body>
</html>
