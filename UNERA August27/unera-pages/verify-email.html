<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email - Huma</title>

    <!-- Code Input Handler -->
    <script src="js/legacy/code-input-handler.js" defer></script>

    <style>
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../fonts/TestFoundersGrotesk-Light.otf') format('opentype'); font-weight:300; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../fonts/TestFoundersGrotesk-LightItalic.otf') format('opentype'); font-weight:300; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../fonts/TestFoundersGrotesk-Regular.otf') format('opentype'); font-weight:400; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../fonts/TestFoundersGrotesk-RegularItalic.otf') format('opentype'); font-weight:400; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../fonts/TestFoundersGrotesk-Medium.otf') format('opentype'); font-weight:500; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../fonts/TestFoundersGrotesk-MediumItalic.otf') format('opentype'); font-weight:500; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../fonts/TestFoundersGrotesk-Semibold.otf') format('opentype'); font-weight:600; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../fonts/TestFoundersGrotesk-SemiboldItalic.otf') format('opentype'); font-weight:600; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../fonts/TestFoundersGrotesk-Bold.otf') format('opentype'); font-weight:700; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../fonts/TestFoundersGrotesk-BoldItalic.otf') format('opentype'); font-weight:700; font-style:italic; font-display:swap; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --brand-deep-blue:   #173d47;
            --brand-yellow:      #ffffab;
            --brand-cloud-blue:  #ebfcf5;
            --brand-earth:       #cec4b8;
            --brand-black:       #000000;
            --brand-white:       #ffffff;
            --brand-red:         #ab5770;
            --brand-purple:      #6a5770;
            --brand-light-blue:  #90c2b8;

            --primary-green:     #173d47;
            --neutral-900:       #173d47;
            --neutral-800:       #1e4e5a;
            --neutral-700:       #2e6374;
            --neutral-600:       #3d6b78;
            --neutral-500:       #90c2b8;
            --neutral-400:       #b8d1d6;
            --neutral-300:       #d8ecee;
            --neutral-200:       #e8f5f6;
            --neutral-100:       #f3fafb;
            --neutral-50:        #ffffff;

            --gradient-primary:  var(--brand-deep-blue);
            --gradient-deep:     var(--brand-deep-blue);
            --gradient-ink:      var(--brand-deep-blue);
            --gradient-warm:     color-mix(in srgb, var(--brand-yellow) 30%, var(--brand-white));
            --gradient-sky:      color-mix(in srgb, var(--brand-cloud-blue) 50%, var(--brand-white));

            --font-display:      'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif;
            --font-body:         'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif;

            --fin-up:            #1a7a5e;
            --fin-up-bg:         color-mix(in srgb, var(--fin-up) 12%, var(--brand-white));
            --fin-down:          var(--brand-red);
            --success:           var(--fin-up);
            --warning:           #b8a030;
            --error:             var(--brand-red);
            --error-bg:          rgba(171, 87, 112, 0.10);

            --text-primary:      #173d47;
            --text-secondary:    #3d6b78;
            --border-subtle:     rgba(23, 61, 71, 0.13);
            --shadow-card:       0 2px 12px rgba(23, 61, 71, 0.07);

            --surface-sky:       color-mix(in srgb, var(--brand-cloud-blue) 18%, var(--brand-white));
            --surface-scatter:   color-mix(in srgb, var(--neutral-200) 38%, var(--brand-white));
            --surface-action-green:        color-mix(in srgb, var(--fin-up) 6%, color-mix(in srgb, var(--brand-cloud-blue) 36%, var(--brand-white)));
            --surface-action-green-strong: color-mix(in srgb, var(--fin-up) 10%, color-mix(in srgb, var(--brand-cloud-blue) 30%, var(--brand-white)));
            --surface-warning-soft:        color-mix(in srgb, var(--brand-yellow) 50%, white);
            --surface-error-soft:          color-mix(in srgb, var(--brand-red) 10%, white);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        body {
            font-family: var(--font-body);
            background: var(--brand-cloud-blue);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Skip link ── */
        .skip-link {
            position: absolute; top: -40px; left: 0;
            background: var(--brand-deep-blue); color: white;
            padding: 8px 16px; text-decoration: none;
            z-index: 10000; border-radius: 0 0 8px 0; font-weight: 600;
        }
        .skip-link:focus { top: 0; outline: 3px solid var(--brand-yellow); }

        /* ── Navigation ── */
        .nav {
            background: var(--gradient-ink);
            padding: 0 2.75rem; height: 44px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 10001;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .nav-brand { display: flex; align-items: center; text-decoration: none; }
        .nav-brand:focus, .nav-brand:focus-visible { outline: 3px solid var(--brand-yellow); outline-offset: 2px; border-radius: 4px; }
        .nav-logo-img { height: 24px; width: auto; max-width: 100%; object-fit: contain; object-position: left center; display: block; }
        .nav-back-link {
            display: inline-flex; align-items: center; gap: 0.375rem;
            color: rgba(255,255,255,0.85); text-decoration: none;
            font-size: 0.813rem; font-weight: 500; padding: 0.3rem 0.75rem;
            border-radius: 0.5rem; transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.18);
        }
        .nav-back-link:hover { color: var(--brand-yellow); border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.06); }
        .nav-back-link:focus, .nav-back-link:focus-visible { outline: 2px solid var(--brand-yellow); outline-offset: 2px; }
        .nav-back-link svg { width: 15px; height: 15px; flex-shrink: 0; }

        /* ── Container ── */
        .container { max-width: 520px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }

        /* ── Widget card ── */
        .widget-card {
            background: var(--brand-white);
            border-radius: 1.25rem;
            border: 1px solid var(--border-subtle);
            padding: 2rem 1.75rem;
            box-shadow: var(--shadow-card);
            text-align: center;
        }

        /* ── Mail icon badge ── */
        .mail-icon-badge {
            width: 72px; height: 72px; border-radius: 1.375rem;
            background: color-mix(in srgb, var(--brand-deep-blue) 8%, var(--brand-white));
            border: 1.5px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem; color: var(--brand-deep-blue);
        }

        /* ── Auth header ── */
        .auth-title {
            font-family: var(--font-display); font-size: 1.625rem; font-weight: 700;
            color: var(--brand-deep-blue); margin-bottom: 0.375rem; line-height: 1.15;
            letter-spacing: -0.02em;
        }
        .email-highlight {
            font-weight: 600; color: var(--brand-deep-blue);
            font-size: 1rem; margin: 0.625rem 0 0;
        }

        /* ── Code digit inputs ── */
        .code-input-group {
            display: flex; gap: 0.5rem; justify-content: center;
            margin: 1.75rem 0;
        }
        .code-digit {
            width: 52px; height: 60px;
            font-size: 1.75rem; font-weight: 700; text-align: center;
            border: 2px solid var(--border-subtle); border-radius: 0.75rem;
            font-family: var(--font-body); color: var(--text-primary);
            background: white;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none; caret-color: transparent;
        }
        .code-digit:focus {
            border-color: var(--brand-deep-blue);
            box-shadow: 0 0 0 3px rgba(23,61,71,0.1);
        }
        .code-digit.filled {
            background: color-mix(in srgb, var(--brand-deep-blue) 5%, white);
            border-color: color-mix(in srgb, var(--brand-deep-blue) 35%, transparent);
        }
        .code-digit.error {
            border-color: var(--error);
            background: var(--surface-error-soft);
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-4px); }
            40%       { transform: translateX(4px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }

        /* ── Buttons ── */
        .btn {
            padding: 0.75rem 1.5rem; border-radius: 0.75rem;
            font-size: 0.938rem; font-weight: 600; border: none; cursor: pointer;
            transition: all 0.2s; font-family: var(--font-body);
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            min-height: 46px; text-decoration: none; width: 100%;
        }
        .btn:focus, .btn:focus-visible { outline: 3px solid rgba(23,61,71,0.35); outline-offset: 2px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--brand-deep-blue); color: var(--brand-white); }
        .btn-primary:hover:not(:disabled) { filter: brightness(0.92); box-shadow: 0 4px 12px rgba(23,61,71,0.3); transform: translateY(-1px); }
        .btn-primary.loading { opacity: 0.7; pointer-events: none; }
        .btn-primary.success { background: var(--fin-up); pointer-events: none; }

        /* ── Resend section ── */
        .resend-section {
            margin-top: 1.75rem; text-align: center;
            color: var(--text-secondary); font-size: 0.875rem;
        }
        .resend-section p { margin-bottom: 0.375rem; }
        .resend-btn {
            background: none; border: none; cursor: pointer;
            color: var(--brand-deep-blue); font-weight: 600;
            font-family: var(--font-body); font-size: 0.875rem;
            text-decoration: underline; text-underline-offset: 2px;
            padding: 0.25rem 0; margin-top: 0.375rem; border-radius: 2px;
            transition: color 0.2s;
        }
        .resend-btn:hover:not(:disabled) { color: var(--neutral-700); }
        .resend-btn:focus, .resend-btn:focus-visible { outline: 2px solid var(--brand-deep-blue); outline-offset: 2px; border-radius: 2px; }
        .resend-btn:disabled { color: var(--neutral-400); cursor: not-allowed; text-decoration: none; }
        .timer { color: var(--text-secondary); font-size: 0.813rem; margin-top: 0.375rem; }

        /* ── Help links ── */
        .help-links {
            display: flex; justify-content: center; gap: 2rem;
            margin-top: 1.75rem; font-size: 0.875rem; flex-wrap: wrap;
        }
        .help-links a {
            color: var(--brand-deep-blue); text-decoration: none; font-weight: 500;
            text-underline-offset: 2px; transition: color 0.2s;
        }
        .help-links a:hover { text-decoration: underline; color: var(--neutral-700); }
        .help-links a:focus, .help-links a:focus-visible { outline: 2px solid var(--brand-deep-blue); outline-offset: 2px; border-radius: 2px; }

        /* ── Modals ── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(23, 61, 71, 0.55);
            backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 10010;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: white; border-radius: 0.75rem;
            max-width: 400px; width: 90%;
            box-shadow: 0 24px 64px rgba(23, 61, 71, 0.22);
            overflow: hidden;
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex; justify-content: space-between; align-items: center;
        }

        .modal-title {
            font-family: var(--font-display); font-size: 1.125rem; font-weight: 700;
            color: var(--text-primary); margin: 0;
        }

        .modal-close {
            background: none; border: none; cursor: pointer;
            color: var(--text-secondary); border-radius: 6px;
            padding: 0.25rem; display: flex; align-items: center; transition: color 0.2s;
        }
        .modal-close:hover { color: var(--brand-deep-blue); }
        .modal-close:focus, .modal-close:focus-visible { outline: 2px solid var(--brand-deep-blue); outline-offset: 2px; }

        .modal-body { padding: 1.5rem; }

        .notification-modal .modal-body { text-align: center; padding: 1.75rem 1.5rem 1.25rem; }

        .notification-icon {
            width: 64px; height: 64px; margin: 0 auto 1.25rem;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: var(--fin-up-bg); color: var(--fin-up);
        }
        .notification-icon.error   { background: var(--surface-error-soft); color: var(--error); }
        .notification-icon.warning { background: var(--surface-warning-soft); color: var(--warning); }
        .notification-icon.info    { background: color-mix(in srgb, var(--brand-light-blue) 22%, var(--brand-white)); color: var(--brand-deep-blue); }

        .notification-message {
            font-size: 0.938rem; line-height: 1.6;
            color: var(--text-secondary); margin: 0;
        }

        .modal-footer {
            padding: 0 1.5rem 1.5rem;
            display: flex; gap: 0.75rem;
        }

        .notification-modal .modal-footer { justify-content: center; }

        .modal-btn {
            flex: 1; padding: 0.75rem 1rem; border-radius: 0.75rem;
            font-size: 0.938rem; font-weight: 600; border: none; cursor: pointer;
            font-family: var(--font-body); min-height: 46px;
            display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .modal-btn:focus, .modal-btn:focus-visible { outline: 3px solid rgba(23,61,71,0.35); outline-offset: 2px; }
        .modal-btn-primary { background: var(--brand-deep-blue); color: var(--brand-white); }
        .modal-btn-primary:hover { filter: brightness(0.92); }
        .modal-btn-secondary { background: transparent; color: var(--text-secondary); border: 2px solid var(--border-subtle); }
        .modal-btn-secondary:hover { border-color: var(--brand-deep-blue); color: var(--brand-deep-blue); }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .nav { padding: 0 1.25rem; }
            .container { padding: 1.5rem 1rem 3rem; }
            .widget-card { padding: 1.5rem 1.25rem; }
            .code-digit { width: 46px; height: 54px; font-size: 1.5rem; }
        }
        @media (max-width: 480px) {
            .auth-title { font-size: 1.375rem; }
            .widget-card { padding: 1.25rem 1rem; }
            .container { padding: 1.25rem 0.875rem 2.5rem; }
            .code-digit { width: 42px; height: 50px; font-size: 1.375rem; }
            .code-input-group { gap: 0.375rem; }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <nav class="nav" role="navigation" aria-label="Site navigation">
        <a href="index.html" class="nav-brand" aria-label="Huma Home">
            <img src="NewLogo/Huma White Text Nav.svg" alt="Huma" class="nav-logo-img" height="24">
        </a>
        <a href="signup_2.html" class="nav-back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M5 12l7 7M5 12l7-7"/></svg>
            Back
        </a>
    </nav>

    <main id="main-content" class="container">
        <div class="widget-card">
            <!-- Mail icon -->
            <div class="mail-icon-badge" aria-hidden="true">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            </div>

            <div class="auth-header">
                <h1 class="auth-title">Check Your Email</h1>
                <!-- <p class="auth-subtitle" id="verifySubtitle">We sent a new verification code to:</p> -->
                <p class="email-highlight" id="userEmail">your@email.com</p>
            </div>

            <!-- Code Input -->
            <div class="code-input-group" id="codeInputGroup" role="group" aria-label="6-digit verification code">
                <input type="text" maxlength="1" class="code-digit" id="digit1" inputmode="numeric" pattern="[0-9]" autocomplete="off" aria-label="Digit 1">
                <input type="text" maxlength="1" class="code-digit" id="digit2" inputmode="numeric" pattern="[0-9]" autocomplete="off" aria-label="Digit 2">
                <input type="text" maxlength="1" class="code-digit" id="digit3" inputmode="numeric" pattern="[0-9]" autocomplete="off" aria-label="Digit 3">
                <input type="text" maxlength="1" class="code-digit" id="digit4" inputmode="numeric" pattern="[0-9]" autocomplete="off" aria-label="Digit 4">
                <input type="text" maxlength="1" class="code-digit" id="digit5" inputmode="numeric" pattern="[0-9]" autocomplete="off" aria-label="Digit 5">
                <input type="text" maxlength="1" class="code-digit" id="digit6" inputmode="numeric" pattern="[0-9]" autocomplete="off" aria-label="Digit 6">
            </div>

            <button class="btn btn-primary" id="verifyBtn" onclick="verifyCode()">
                Verify &amp; Continue
            </button>

            <!-- Resend Section -->
            <div class="resend-section">
                <p>Didn't receive the code?</p>
                <button class="resend-btn" id="resendBtn" onclick="resendCode()" disabled>
                    Resend Code
                </button>
                <p class="timer" id="resendTimer">Resend available in <span id="countdown">30</span>s</p>
            </div>

            <!-- Help Links -->
            <div class="help-links">
                <a href="#" onclick="changeEmail(); return false;">Change email</a>
                <a href="#" onclick="showNotification('For assistance, please contact our support team at support@unera.io', 'info', 'Contact Support'); return false;">Need help?</a>
            </div>
        </div>
    </main>

    <!-- Notification Modal -->
    <div class="modal-overlay" id="notificationModal" role="dialog" aria-modal="true" aria-labelledby="notificationTitle">
        <div class="modal notification-modal">
            <div class="modal-header">
                <h2 id="notificationTitle" class="modal-title">Notification</h2>
                <button class="modal-close" onclick="closeNotificationModal()" aria-label="Close notification">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="notification-icon" id="notificationIcon" aria-hidden="true">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
                </div>
                <p class="notification-message" id="notificationMessage"></p>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-primary" onclick="closeNotificationModal()" style="max-width: 180px;">OK</button>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal-overlay" id="confirmationModal" role="dialog" aria-modal="true" aria-labelledby="confirmationTitle">
        <div class="modal notification-modal">
            <div class="modal-header">
                <h2 id="confirmationTitle" class="modal-title">Confirm</h2>
                <button class="modal-close" onclick="closeConfirmationModal()" aria-label="Close confirmation">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="notification-icon warning" id="confirmationIcon" aria-hidden="true">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
                <p class="notification-message" id="confirmationMessage"></p>
            </div>
            <div class="modal-footer" style="justify-content: stretch;">
                <button class="modal-btn modal-btn-secondary" onclick="closeConfirmationModal()">Cancel</button>
                <button class="modal-btn modal-btn-primary" id="confirmButton">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        /* ── Init from URL / localStorage ── */
        const urlParams = new URLSearchParams(window.location.search);
        const userEmail = urlParams.get('email') || localStorage.getItem('signupEmail') || 'your@email.com';
        const fromLogin = urlParams.get('from') === 'login';
        document.getElementById('userEmail').textContent = userEmail;

        if (fromLogin) {
            const title    = document.querySelector('.auth-title');
            const subtitle = document.getElementById('verifySubtitle');
            if (title) title.textContent = 'Verify Your Email';
            if (subtitle) subtitle.textContent = 'We sent a new verification code to:';
        }

        /* ── Auto-focus first digit ── */
        const digits = document.querySelectorAll('.code-digit');
        digits[0].focus();

        /* ── Handle digit input ── */
        digits.forEach((digit, index) => {
            digit.addEventListener('input', (e) => {
                const value = e.target.value;

                if (!/^\d*$/.test(value)) {
                    e.target.value = '';
                    return;
                }

                if (value) {
                    e.target.classList.add('filled');
                    if (index < 5) {
                        digits[index + 1].focus();
                    }
                    if (index === 5) {
                        setTimeout(() => verifyCode(), 100);
                    }
                } else {
                    e.target.classList.remove('filled');
                }
            });

            digit.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    if (!e.target.value && index > 0) {
                        digits[index - 1].focus();
                        digits[index - 1].value = '';
                        digits[index - 1].classList.remove('filled');
                    }
                }
                if (e.key === 'v' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    handlePaste(e);
                }
            });

            digit.addEventListener('focus', () => {
                digits.forEach(d => d.classList.remove('error'));
            });
        });

        /* ── Handle paste ── */
        document.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedData = e.clipboardData.getData('text').replace(/\D/g, '');
            if (pastedData.length === 6) {
                pastedData.split('').forEach((char, index) => {
                    digits[index].value = char;
                    digits[index].classList.add('filled');
                });
                digits[5].focus();
                setTimeout(() => verifyCode(), 100);
            }
        });

        /* ── Resend timer ── */
        let countdown = 30;
        const resendBtn   = document.getElementById('resendBtn');
        const resendTimer = document.getElementById('resendTimer');
        const countdownSpan = document.getElementById('countdown');

        function startResendTimer() {
            countdown = 30;
            resendBtn.disabled = true;
            resendTimer.style.display = 'block';

            const timer = setInterval(() => {
                countdown--;
                countdownSpan.textContent = countdown;
                if (countdown === 0) {
                    clearInterval(timer);
                    resendBtn.disabled = false;
                    resendTimer.style.display = 'none';
                }
            }, 1000);
        }

        startResendTimer();

        /* ── Verify code ── */
        async function verifyCode() {
            const code = Array.from(digits).map(d => d.value).join('');

            if (code.length !== 6) {
                showError('Please enter all 6 digits');
                return;
            }

            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.classList.add('loading');
            verifyBtn.disabled = true;

            try {
                await new Promise(resolve => setTimeout(resolve, 1500));

                const isValid = code.length === 6;

                if (isValid) {
                    verifyBtn.classList.remove('loading');
                    verifyBtn.classList.add('success');
                    verifyBtn.textContent = 'Verified!';

                    localStorage.setItem('emailVerified', 'true');
                    localStorage.setItem('verificationCode', code);

                    if (window.navigator.vibrate) {
                        window.navigator.vibrate([10, 50, 10]);
                    }

                    setTimeout(() => {
                        if (fromLogin) {
                            const twoFAEnabled  = localStorage.getItem('2faEnabled') === 'true';
                            const deviceTrusted = localStorage.getItem('deviceTrusted') === 'true';
                            const trustExpiry   = parseInt(localStorage.getItem('deviceTrustedUntil')) || 0;

                            localStorage.setItem('isLoggedIn', 'true');
                            localStorage.setItem('loginTimestamp', new Date().toISOString());

                            if (twoFAEnabled && (!deviceTrusted || Date.now() > trustExpiry)) {
                                window.location.href = 'verify-2fa.html';
                            } else {
                                window.location.href = 'dashboard-enhanced.html';
                            }
                        } else {
                            window.location.href = 'signup_2.html?step=details&verified=true';
                        }
                    }, 1000);
                } else {
                    throw new Error('Invalid code');
                }
            } catch (error) {
                verifyBtn.classList.remove('loading');
                verifyBtn.disabled = false;
                showError('Invalid code. Please try again.');

                if (window.navigator.vibrate) {
                    window.navigator.vibrate([10, 100, 10, 100, 10]);
                }
            }
        }

        /* ── Resend code ── */
        async function resendCode() {
            resendBtn.textContent = 'Sending...';
            resendBtn.disabled = true;

            try {
                await new Promise(resolve => setTimeout(resolve, 1000));

                console.log('Resending verification code to:', userEmail);

                resendBtn.textContent = 'Code Sent!';

                setTimeout(() => {
                    resendBtn.textContent = 'Resend Code';
                    startResendTimer();
                }, 2000);

                digits.forEach(digit => {
                    digit.value = '';
                    digit.classList.remove('filled');
                });
                digits[0].focus();

            } catch (error) {
                resendBtn.textContent = 'Resend Code';
                resendBtn.disabled = false;
                showNotification('Failed to resend code. Please try again.', 'error', 'Resend Failed');
            }
        }

        /* ── Change email ── */
        function changeEmail() {
            showConfirmation(
                'Go back and change your email address? Your current verification will be cancelled.',
                'Change Email',
                () => {
                    localStorage.removeItem('signupEmail');
                    localStorage.removeItem('emailVerified');
                    window.location.href = 'signup_2.html';
                }
            );
        }

        /* ── Show error ── */
        function showError(message) {
            digits.forEach(digit => digit.classList.add('error'));
            showNotification(message, 'error', 'Verification Failed');
            setTimeout(() => {
                digits.forEach(digit => {
                    digit.value = '';
                    digit.classList.remove('filled', 'error');
                });
                digits[0].focus();
            }, 500);
        }

        /* ── Enter key -> verify ── */
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                verifyCode();
            }
        });

        /* ── Modal: Notification ── */
        function showNotification(message, type, title) {
            type  = type  || 'success';
            title = title || 'Success';

            const modal     = document.getElementById('notificationModal');
            const icon      = document.getElementById('notificationIcon');
            const messageEl = document.getElementById('notificationMessage');
            const titleEl   = document.getElementById('notificationTitle');

            titleEl.textContent   = title;
            messageEl.textContent = message;
            icon.className        = 'notification-icon';
            if (type === 'error')   icon.classList.add('error');
            else if (type === 'warning') icon.classList.add('warning');
            else if (type === 'info')    icon.classList.add('info');

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeNotificationModal() {
            document.getElementById('notificationModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        /* ── Modal: Confirmation ── */
        function showConfirmation(message, title, onConfirm) {
            title = title || 'Confirm';

            const modal     = document.getElementById('confirmationModal');
            const messageEl = document.getElementById('confirmationMessage');
            const titleEl   = document.getElementById('confirmationTitle');
            const confirmBtn = document.getElementById('confirmButton');

            titleEl.textContent   = title;
            messageEl.textContent = message;
            confirmBtn.onclick    = () => {
                closeConfirmationModal();
                if (onConfirm) onConfirm();
            };

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeConfirmationModal() {
            document.getElementById('confirmationModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        /* ── Escape closes modals ── */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeNotificationModal();
                closeConfirmationModal();
            }
        });
    </script>
</body>
</html>
