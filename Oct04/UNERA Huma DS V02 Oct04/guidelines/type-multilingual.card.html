<!-- @dsCard group="Type" viewport="700x170" name="Multilingual" subtitle="CJK · Arabic · system font stacks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:24px; color:var(--brand-deep-blue); }
  .block { padding:12px 0; border-bottom:1px solid var(--border-subtle); }
  .block:last-child { border-bottom:none; }
  .lbl { font-family:var(--font-mono); font-size:10.5px; color:var(--text-secondary); margin-bottom:4px; }
  .cjk { font-family:var(--font-chinese); font-size:24px; font-weight:500; }
  .ar { font-family:var(--font-arabic); font-size:24px; font-weight:600; direction:rtl; text-align:right; }
</style>
</head>
<body>
  <div class="block">
    <div class="lbl">--font-chinese · system CJK</div>
    <div class="cjk">一种流动，惠及众生 · 稳定数字基础设施</div>
  </div>
  <div class="block">
    <div class="lbl">--font-arabic · system Arabic</div>
    <div class="ar">تدفق واحد. حياة كثيرة. قيمة مشتركة بالتصميم</div>
  </div>
</body>
</html>
