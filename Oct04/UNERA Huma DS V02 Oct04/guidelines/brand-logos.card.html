<!-- @dsCard group="Brand" viewport="700x230" name="Logo Lockups" subtitle="Primary wordmark · white on Deep Blue, black on light" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:20px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .panel { border-radius:var(--radius-md); height:170px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; border:1px solid var(--border-subtle); }
  .dark { background:var(--brand-deep-blue); }
  .light { background:var(--brand-white); }
  .panel img { width:200px; }
  .lbl { font-size:10px; text-transform:uppercase; letter-spacing:0.1em; }
  .dark .lbl { color:rgba(255,255,255,0.45); }
  .light .lbl { color:var(--text-secondary); }
</style>
</head>
<body>
  <div class="grid">
    <div class="panel dark"><img src="../assets/logos/huma-white-text.svg" alt="Huma"><span class="lbl">White · on Deep Blue</span></div>
    <div class="panel light"><img src="../assets/logos/huma-black-text.svg" alt="Huma"><span class="lbl">Black · on light</span></div>
  </div>
</body>
</html>
