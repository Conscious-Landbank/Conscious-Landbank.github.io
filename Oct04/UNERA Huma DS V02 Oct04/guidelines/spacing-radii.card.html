<!-- @dsCard group="Spacing" viewport="700x170" name="Radii" subtitle="xs 6 · sm 8 · md 12 · lg 16 · card 20 · pill · full" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:24px; }
  .row { display:flex; gap:16px; align-items:flex-end; }
  .item { text-align:center; }
  .box { width:74px; height:74px; background:var(--surface-impact); border:2px solid var(--brand-deep-blue); }
  .lbl { font-family:var(--font-mono); font-size:10.5px; color:var(--text-secondary); margin-top:8px; }
  .pill { width:96px; border-radius:var(--radius-pill); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="lbl">xs · 6</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl">md · 12</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl">lg · 16</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-card)"></div><div class="lbl">card · 20</div></div>
    <div class="item"><div class="box pill" style="border-radius:var(--radius-pill)"></div><div class="lbl">pill</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-full)"></div><div class="lbl">full</div></div>
  </div>
</body>
</html>
