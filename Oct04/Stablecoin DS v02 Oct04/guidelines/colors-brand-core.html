<!-- @dsCard group="Colors" viewport="700x210" subtitle="Deep Blue anchor + new Ink & Teal depth, Cloud Blue & Earth warmth" name="Brand core" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{padding:22px;background:#fff}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1;min-width:110px;border-radius:10px;border:1px solid var(--border-subtle);overflow:hidden}
  .chip{height:74px}
  .meta{padding:9px 11px}
  .nm{font-size:.76rem;font-weight:700;color:var(--text-primary)}
  .hx{font-size:.68rem;color:var(--text-secondary);font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.04em}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--brand-ink)"></div><div class="meta"><div class="nm">Ink (pure black)</div><div class="hx">#000000</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-deep-blue)"></div><div class="meta"><div class="nm">Near Black (chrome)</div><div class="hx">#1d1d1f</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-teal)"></div><div class="meta"><div class="nm">Teal</div><div class="hx">#2f7682</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-cloud-blue)"></div><div class="meta"><div class="nm">Cloud Blue</div><div class="hx">#eafaf4</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-earth)"></div><div class="meta"><div class="nm">Earth</div><div class="hx">#cabfb1</div></div></div>
  </div>
</body></html>
