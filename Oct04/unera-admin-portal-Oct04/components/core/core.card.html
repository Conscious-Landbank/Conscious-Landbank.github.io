<!-- @dsCard group="Components" viewport="700x600" name="Core" subtitle="Button · StatusChip · Tag · MetricTile · Panel · Callout" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;font-family:var(--font-body);background:#fff;color:var(--text-primary)}.g{margin-bottom:18px}.l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:8px}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window[Object.keys(window).find(k => window[k] && window[k].StatusChip && window[k].Button)] || {};
const { Button, StatusChip, Tag, MetricTile, Panel, Callout } = NS;
function Demo(){ return <div>
  <div className="g"><div className="l">Button</div><div className="r"><Button>Retry transaction</Button><Button variant="secondary">Export CSV</Button><Button variant="ghost">Open in Sumsub</Button><Button variant="danger">Blacklist wallet</Button><Button variant="danger-outline">Archive center</Button><Button size="sm" variant="secondary">Small</Button><Button loading>Working</Button><Button disabled title="Requires Super Admin">Approve</Button></div></div>
  <div className="g"><div className="l">StatusChip</div><div className="r">{['Completed','Active','Pending approval','Processing','Failed','Stuck','Blacklisted','Archived','Action required'].map(s => <StatusChip key={s} status={s} pulse={s==='Processing'} />)}</div></div>
  <div className="g"><div className="l">Tag</div><div className="r"><Tag>Donor</Tag><Tag>High value</Tag><Tag onRemove={()=>{}}>Partner</Tag><Tag layer="huma">Huma</Tag><Tag layer="stablecoin">Stablecoin</Tag><Tag>Polygon</Tag></div></div>
  <div className="g"><div className="l">MetricTile</div><div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}><MetricTile label="Failed transactions" value="4" alert delta="+2" deltaDirection="down" meta="vs yesterday · last 24h" onClick={()=>{}} /><MetricTile label="Reserve ratio" value="100.64%" delta="+0.03 pt" deltaDirection="up" meta="snapshot 01 Oct 2026" /><MetricTile label="Pending approvals" value="3" meta="1 reserve · 2 rectifications" onClick={()=>{}} /></div></div>
  <div className="g"><div className="l">Panel + Callout</div><Panel title="Eligible actions" subtitle="TX-9C41E2A7" actions={<Button size="sm">Retry transaction</Button>}><Callout tone="danger" title="Failure reason">Slippage exceeded 0.5% tolerance during AMM execution. Approval succeeded; swap reverted.</Callout><div style={{height:8}}/><Callout tone="info">Retry triggers the approved backend workflow. The portal never executes on-chain actions.</Callout></Panel></div>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
