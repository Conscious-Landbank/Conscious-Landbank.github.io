<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-body);color:var(--text-primary);background:#fff;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}.sw i{display:block;height:44px;border-radius:8px;border:1px solid var(--line)}.sw b{font-weight:600;font-size:12px}.sw span{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--brand-deep-blue)"></i><b>Deep Blue</b><span>#173d47 · chrome, primary</span></div><div class="sw"><i style="background:var(--brand-ink)"></i><b>Ink</b><span>#1d1d1f · text</span></div><div class="sw"><i style="background:var(--brand-yellow)"></i><b>Signal Yellow</b><span>#ecd6a0 · on dark only</span></div><div class="sw"><i style="background:var(--brand-yellow-ink)"></i><b>Yellow ink</b><span>#8a6a16 · on light</span></div><div class="sw"><i style="background:var(--verify-teal)"></i><b>Verified Teal</b><span>#127c72 · on-chain</span></div></div></body></html>
