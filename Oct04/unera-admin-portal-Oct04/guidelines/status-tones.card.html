<!-- @dsCard group="Status" viewport="700x190" subtitle="Six tones; label + tint + dot. Use requirement vocabulary as the label" name="Status tones" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-body);color:var(--text-primary);background:#fff;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}.sw i{display:block;height:44px;border-radius:8px;border:1px solid var(--line)}.sw b{font-weight:600;font-size:12px}.sw span{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}</style></head><body><div class="row" style="gap:8px 10px"><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-ok-bg);color:var(--tone-ok-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Completed</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-ok-bg);color:var(--tone-ok-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Active</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-ok-bg);color:var(--tone-ok-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Published</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-pending-bg);color:var(--tone-pending-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Pending approval</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-pending-bg);color:var(--tone-pending-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>On hold</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-info-bg);color:var(--tone-info-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Processing</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-info-bg);color:var(--tone-info-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Draft</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-bad-bg);color:var(--tone-bad-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Failed</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-bad-bg);color:var(--tone-bad-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Stuck</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-bad-bg);color:var(--tone-bad-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Blacklisted</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-neutral-bg);color:var(--tone-neutral-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Archived</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-neutral-bg);color:var(--tone-neutral-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Superseded</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-attention-bg);color:var(--tone-attention-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Action required</span><span style="display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 7px;border-radius:980px;font-size:12px;font-weight:600;background:var(--tone-attention-bg);color:var(--tone-attention-fg)"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>Delayed</span></div>
<p style="color:var(--text-secondary);font-size:12px;margin:14px 0 0">ok · pending · info · bad · neutral · attention. Status never relies on color alone: the word is always present; failed rows add an inline failure reason.</p></body></html>
