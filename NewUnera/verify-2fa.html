<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication - UNERA</title>

    <!-- Code Input Handler -->
    <script src="../code-input-handler.js" defer></script>

    <style>
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../Brand Guide/TestFoundersGrotesk-Light.otf') format('opentype'); font-weight:300; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../Brand Guide/TestFoundersGrotesk-LightItalic.otf') format('opentype'); font-weight:300; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../Brand Guide/TestFoundersGrotesk-Regular.otf') format('opentype'); font-weight:400; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../Brand Guide/TestFoundersGrotesk-RegularItalic.otf') format('opentype'); font-weight:400; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../Brand Guide/TestFoundersGrotesk-Medium.otf') format('opentype'); font-weight:500; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../Brand Guide/TestFoundersGrotesk-MediumItalic.otf') format('opentype'); font-weight:500; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../Brand Guide/TestFoundersGrotesk-Semibold.otf') format('opentype'); font-weight:600; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../Brand Guide/TestFoundersGrotesk-SemiboldItalic.otf') format('opentype'); font-weight:600; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../Brand Guide/TestFoundersGrotesk-Bold.otf') format('opentype'); font-weight:700; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../Brand Guide/TestFoundersGrotesk-BoldItalic.otf') format('opentype'); font-weight:700; font-style:italic; font-display:swap; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --brand-deep-blue:   #173d47;
            --brand-yellow:      #ffffab;
            --brand-cloud-blue:  #ebfcf5;
            --brand-earth:       #cec4b8;
            --brand-black:       #000000;
            --brand-white:       #ffffff;
            --brand-red:         #ab5770;
            --brand-purple:      #6a5770;
            --brand-light-blue:  #90c2b8;

            --primary-green:     #173d47;
            --primary-blue:      #90c2b8;
            --neutral-900:       #173d47;
            --neutral-800:       #1e4e5a;
            --neutral-700:       #2e6374;
            --neutral-600:       #3d6b78;
            --neutral-500:       #90c2b8;
            --neutral-400:       #b8d1d6;
            --neutral-300:       #d8ecee;
            --neutral-200:       #e8f5f6;
            --neutral-100:       #f3fafb;
            --neutral-50:        #ffffff;

            --gradient-primary:  var(--brand-deep-blue);
            --gradient-deep:     var(--brand-deep-blue);
            --gradient-ink:      var(--brand-deep-blue);
            --gradient-warm:     color-mix(in srgb, var(--brand-yellow) 30%, var(--brand-white));
            --gradient-sky:      color-mix(in srgb, var(--brand-cloud-blue) 50%, var(--brand-white));

            --font-display:      'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif;
            --font-body:         'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif;

            --fin-up:            #1a7a5e;
            --fin-up-bg:         color-mix(in srgb, var(--fin-up) 12%, var(--brand-white));
            --fin-down:          var(--brand-red);
            --fin-down-bg:       color-mix(in srgb, var(--brand-red) 12%, var(--brand-white));
            --success:           var(--fin-up);
            --warning:           #b8a030;
            --error:             var(--brand-red);
            --error-bg:          rgba(171, 87, 112, 0.10);

            --text-primary:      #173d47;
            --text-secondary:    #3d6b78;
            --border-subtle:     rgba(23, 61, 71, 0.13);
            --shadow-card:       0 2px 12px rgba(23, 61, 71, 0.07);

            --surface-sky:       color-mix(in srgb, var(--brand-cloud-blue) 18%, var(--brand-white));
            --surface-scatter:   color-mix(in srgb, var(--neutral-200) 38%, var(--brand-white));
            --surface-action-green:        color-mix(in srgb, var(--fin-up) 6%, color-mix(in srgb, var(--brand-cloud-blue) 36%, var(--brand-white)));
            --surface-action-green-strong: color-mix(in srgb, var(--fin-up) 10%, color-mix(in srgb, var(--brand-cloud-blue) 30%, var(--brand-white)));
            --surface-warning-soft:        color-mix(in srgb, var(--brand-yellow) 50%, white);
            --surface-error-soft:          color-mix(in srgb, var(--brand-red) 10%, white);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        body {
            font-family: var(--font-body);
            background: var(--brand-cloud-blue);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Skip link ── */
        .skip-link {
            position: absolute; top: -40px; left: 0;
            background: var(--brand-deep-blue); color: white;
            padding: 8px 16px; text-decoration: none;
            z-index: 10000; border-radius: 0 0 8px 0; font-weight: 600;
        }
        .skip-link:focus { top: 0; outline: 3px solid var(--brand-yellow); }

        /* ── Navigation ── */
        .nav {
            background: var(--gradient-ink);
            padding: 0 2.75rem; height: 44px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 10001;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .nav-brand { display: flex; align-items: center; text-decoration: none; }
        .nav-brand:focus, .nav-brand:focus-visible { outline: 3px solid var(--brand-yellow); outline-offset: 2px; border-radius: 4px; }
        .nav-logo-img { height: 24px; width: auto; max-width: 100%; object-fit: contain; object-position: left center; display: block; }
        .nav-back-link {
            display: inline-flex; align-items: center; gap: 0.375rem;
            color: rgba(255,255,255,0.85); text-decoration: none;
            font-size: 0.813rem; font-weight: 500; padding: 0.3rem 0.75rem;
            border-radius: 0.5rem; transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.18);
        }
        .nav-back-link:hover { color: var(--brand-yellow); border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.06); }
        .nav-back-link:focus, .nav-back-link:focus-visible { outline: 2px solid var(--brand-yellow); outline-offset: 2px; }
        .nav-back-link svg { width: 15px; height: 15px; flex-shrink: 0; }

        /* ── Container ── */
        .container { max-width: 480px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }

        /* ── Widget card ── */
        .widget-card {
            background: var(--brand-white);
            border-radius: 1.25rem;
            border: 1px solid var(--border-subtle);
            padding: 2rem 1.75rem;
            box-shadow: var(--shadow-card);
        }

        /* ── Auth header ── */
        .auth-header { text-align: center; margin-bottom: 1.75rem; }
        .auth-icon-badge {
            width: 64px; height: 64px; border-radius: 1.25rem;
            background: var(--brand-deep-blue);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem; color: var(--brand-white);
        }
        .auth-title {
            font-family: var(--font-display); font-size: 1.625rem; font-weight: 700;
            color: var(--brand-deep-blue); margin-bottom: 0.5rem; line-height: 1.15;
            letter-spacing: -0.02em;
        }
        .auth-subtitle { font-size: 0.938rem; color: var(--text-secondary); line-height: 1.55; }

        /* ── Code digit inputs ── */
        .code-input-group {
            display: flex; gap: 0.5rem; justify-content: center;
            margin: 1.75rem 0;
        }
        .code-digit {
            width: 52px; height: 60px;
            font-size: 1.75rem; font-weight: 700; text-align: center;
            border: 2px solid var(--border-subtle); border-radius: 0.75rem;
            font-family: var(--font-body); color: var(--text-primary);
            background: var(--brand-white);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none; caret-color: transparent;
        }
        .code-digit:hover { border-color: var(--brand-deep-blue); }
        .code-digit:focus {
            border-color: var(--brand-deep-blue);
            box-shadow: 0 0 0 3px rgba(23, 61, 71, 0.10);
        }
        .code-digit.filled {
            background: color-mix(in srgb, var(--brand-deep-blue) 5%, white);
            border-color: color-mix(in srgb, var(--brand-deep-blue) 35%, transparent);
        }
        .code-digit.error {
            border-color: var(--error);
            background: var(--surface-error-soft);
        }

        /* ── Checkbox group ── */
        .checkbox-group {
            display: flex; align-items: center; justify-content: center; gap: 0.625rem;
            margin-bottom: 1.5rem; cursor: pointer;
        }
        .checkbox-input {
            width: 1.125rem; height: 1.125rem;
            accent-color: var(--brand-deep-blue); cursor: pointer; flex-shrink: 0;
        }
        .checkbox-label {
            font-size: 0.9rem; color: var(--text-secondary); cursor: pointer;
        }

        /* ── Buttons ── */
        .btn {
            padding: 0.75rem 1.5rem; border-radius: 0.75rem;
            font-size: 0.938rem; font-weight: 600; border: none; cursor: pointer;
            transition: all 0.2s; font-family: var(--font-body);
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            min-height: 46px; text-decoration: none; width: 100%;
        }
        .btn:focus, .btn:focus-visible { outline: 3px solid rgba(23,61,71,0.35); outline-offset: 2px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--brand-deep-blue); color: var(--brand-white); }
        .btn-primary:hover:not(:disabled) { filter: brightness(0.92); box-shadow: 0 4px 12px rgba(23,61,71,0.3); transform: translateY(-1px); }
        .btn-primary.loading { opacity: 0.75; pointer-events: none; position: relative; }
        .btn-primary.loading::after {
            content: '';
            position: absolute; right: 1rem;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: var(--brand-white);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-primary.success { background: var(--fin-up); pointer-events: none; }
        .btn-secondary {
            background: transparent; color: var(--text-secondary);
            border: 2px solid var(--border-subtle);
        }
        .btn-secondary:hover:not(:disabled) { border-color: var(--brand-deep-blue); color: var(--brand-deep-blue); }

        /* ── Form input (used in prompt modal) ── */
        .form-input {
            width: 100%; padding: 0.75rem 1rem;
            border: 1.5px solid var(--border-subtle); border-radius: 0.75rem;
            font-family: var(--font-body); font-size: 1rem; color: var(--text-primary);
            background: var(--brand-white); transition: border-color 0.2s, box-shadow 0.2s; outline: none;
        }
        .form-input:focus { border-color: var(--brand-deep-blue); box-shadow: 0 0 0 3px rgba(23,61,71,0.08); }
        @media (max-width: 480px) { .form-input { font-size: 1rem; } }

        /* ── Auth link ── */
        .auth-link {
            color: var(--brand-deep-blue); font-size: 0.875rem; font-weight: 600;
            text-decoration: none; text-underline-offset: 2px;
        }
        .auth-link:hover { color: var(--neutral-700); text-decoration: underline; }
        .auth-link:focus, .auth-link:focus-visible { outline: 2px solid var(--brand-deep-blue); outline-offset: 2px; border-radius: 2px; }

        /* ── Help section ── */
        .help-section {
            text-align: center; margin-top: 2rem; font-size: 0.875rem;
        }
        .help-section p {
            color: var(--text-secondary); margin-bottom: 0.75rem;
        }
        .help-links {
            display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;
        }

        /* ── Modals ── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 10010;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--brand-white); border-radius: 1.25rem;
            max-width: 400px; width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-title {
            font-family: var(--font-display); font-size: 1.125rem; font-weight: 700;
            color: var(--text-primary); margin: 0;
        }
        .modal-close {
            background: none; border: none; cursor: pointer;
            color: var(--text-secondary); border-radius: 6px;
            padding: 0.25rem; display: flex; align-items: center; transition: color 0.2s;
        }
        .modal-close:hover { color: var(--brand-deep-blue); }
        .modal-close:focus, .modal-close:focus-visible { outline: 2px solid var(--brand-deep-blue); outline-offset: 2px; }

        .modal-body { padding: 1.5rem; }

        .notification-modal .modal-header { border-bottom: none; }
        .notification-modal .modal-body { text-align: center; padding: 1.75rem 1.5rem 1.25rem; }
        .notification-modal .modal-footer { border-top: none; padding: 0 1.5rem 1.5rem; }

        .notification-icon {
            width: 64px; height: 64px; margin: 0 auto 1.25rem;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 1.75rem;
            background: var(--fin-up-bg); color: var(--fin-up);
        }
        .notification-icon.error   { background: var(--surface-error-soft); color: var(--error); }
        .notification-icon.warning { background: var(--surface-warning-soft); color: var(--warning); }
        .notification-icon.info    { background: color-mix(in srgb, var(--brand-light-blue) 22%, var(--brand-white)); color: var(--brand-deep-blue); }
        .notification-icon.success { background: var(--fin-up-bg); color: var(--fin-up); }

        .notification-message {
            font-size: 0.938rem; line-height: 1.6;
            color: var(--text-secondary); margin: 0;
        }

        .modal-footer {
            padding: 0 1.5rem 1.5rem;
            border-top: 1px solid var(--border-subtle);
        }
        .modal-footer-row {
            display: flex; gap: 0.75rem;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .nav { padding: 0 1.25rem; }
            .container { padding: 1.5rem 1rem 3rem; }
            .widget-card { padding: 1.5rem 1.25rem; }
        }
        @media (max-width: 480px) {
            .auth-title { font-size: 1.375rem; }
            .widget-card { padding: 1.25rem 1rem; }
            .container { padding: 1.25rem 0.875rem 2.5rem; }
            .code-digit { width: 44px; height: 54px; font-size: 1.5rem; }
            .code-input-group { gap: 0.375rem; }
        }
    </style>
</head>
<body>
    <!-- Skip Link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Navigation -->
    <nav class="nav" role="navigation" aria-label="Site navigation">
        <a href="index.html" class="nav-brand" aria-label="UNERA Home">
            <img src="NewLogo/Unera White Text Nav.svg" alt="UNERA" class="nav-logo-img" height="24">
        </a>
        <a href="login_2.html" class="nav-back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M5 12l7 7M5 12l7-7"/></svg>
            Back
        </a>
    </nav>

    <!-- Main Content -->
    <main id="main-content" class="container">
        <div class="widget-card">
            <div class="auth-header">
                <div class="auth-icon-badge" aria-hidden="true">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </div>
                <h1 class="auth-title">Two-Factor Authentication</h1>
                <p class="auth-subtitle">Enter the code from your <span id="methodText">authenticator app</span></p>
            </div>

            <!-- Code Input -->
            <div class="code-input-group">
                <input type="text" maxlength="1" class="code-digit" id="digit1" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="code-digit" id="digit2" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="code-digit" id="digit3" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="code-digit" id="digit4" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="code-digit" id="digit5" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="code-digit" id="digit6" inputmode="numeric" autocomplete="off">
            </div>

            <!-- Trust This Device -->
            <div class="checkbox-group" style="margin-bottom: 1.5rem; justify-content: center;">
                <input type="checkbox" id="trustDevice" class="checkbox-input">
                <label for="trustDevice" class="checkbox-label">Trust this device for 30 days</label>
            </div>

            <button class="btn btn-primary" id="verifyBtn" onclick="verify2FA()">
                Verify &amp; Continue
            </button>

            <!-- Help Links -->
            <div class="help-section">
                <p>Having trouble?</p>
                <div class="help-links">
                    <a href="#" class="auth-link" onclick="useBackupCode(); return false;">Use backup code</a>
                    <a href="#" class="auth-link" onclick="showNotification('For assistance, please contact our support team at support@unera.io', 'info', 'Contact Support'); return false;">Contact support</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Custom Notification Modal -->
    <div class="modal-overlay" id="notificationModal" role="dialog" aria-modal="true">
        <div class="modal notification-modal">
            <div class="modal-header">
                <h2 id="notificationTitle" class="modal-title">Notification</h2>
                <button class="modal-close" onclick="closeNotificationModal()" aria-label="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="notification-icon" id="notificationIcon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                </div>
                <p class="notification-message" id="notificationMessage"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="closeNotificationModal()">OK</button>
            </div>
        </div>
    </div>

    <!-- Custom Prompt Modal -->
    <div class="modal-overlay" id="promptModal" role="dialog" aria-modal="true">
        <div class="modal notification-modal">
            <div class="modal-header">
                <h2 id="promptTitle" class="modal-title">Input Required</h2>
                <button class="modal-close" onclick="closePromptModal()" aria-label="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="notification-message" id="promptMessage"></p>
                <input type="text" id="promptInput" class="form-input" style="margin-top: 1rem;">
            </div>
            <div class="modal-footer modal-footer-row">
                <button class="btn btn-secondary" onclick="closePromptModal()" style="flex: 1;">Cancel</button>
                <button class="btn btn-primary" id="promptSubmitButton" style="flex: 1;">Submit</button>
            </div>
        </div>
    </div>

    <!-- Auth Flow Manager -->
    <script src="../auth-flow.js"></script>

    <!-- JavaScript -->
    <script>
        // Get 2FA method from localStorage
        const twoFAMethod = localStorage.getItem('2faMethod') || 'app';
        const methodTexts = {
            sms: 'SMS text message',
            email: 'email',
            app: 'authenticator app'
        };
        document.getElementById('methodText').textContent = methodTexts[twoFAMethod];

        // Auto-focus and auto-advance
        const digits = document.querySelectorAll('.code-digit');
        digits[0].focus();

        digits.forEach((digit, index) => {
            digit.addEventListener('input', (e) => {
                const value = e.target.value;
                
                // Only allow numbers
                if (!/^\d*$/.test(value)) {
                    e.target.value = '';
                    return;
                }
                
                if (value) {
                    e.target.classList.add('filled');
                    if (index < 5) {
                        digits[index + 1].focus();
                    } else {
                        // Auto-submit when last digit entered
                        setTimeout(() => verify2FA(), 100);
                    }
                } else {
                    e.target.classList.remove('filled');
                }
            });
            
            digit.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    digits[index - 1].focus();
                }
            });
        });

        // Handle paste
        document.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedData = e.clipboardData.getData('text').replace(/\D/g, '');
            
            if (pastedData.length === 6) {
                pastedData.split('').forEach((char, index) => {
                    digits[index].value = char;
                    digits[index].classList.add('filled');
                });
                setTimeout(() => verify2FA(), 100);
            }
        });

        // Verify 2FA code
        async function verify2FA() {
            const code = Array.from(digits).map(d => d.value).join('');
            
            if (code.length !== 6) {
                showNotification('Please enter all 6 digits of your verification code.', 'warning', 'Code Required');
                return;
            }
            
            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.classList.add('loading');
            verifyBtn.disabled = true;
            
            try {
                // Simulate API verification
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Success!
                verifyBtn.classList.remove('loading');
                verifyBtn.classList.add('success');
                verifyBtn.textContent = 'Verified!';
                
                // Store trust device setting
                const trustDevice = document.getElementById('trustDevice').checked;
                if (trustDevice) {
                    localStorage.setItem('deviceTrusted', 'true');
                    localStorage.setItem('deviceTrustedUntil', Date.now() + (30 * 24 * 60 * 60 * 1000)); // 30 days
                }
                
                // Haptic feedback
                if (window.navigator.vibrate) {
                    window.navigator.vibrate([10, 50, 10]);
                }
                
                console.log('✅ 2FA verified successfully');
                
                // Check KYC status and redirect
                setTimeout(() => {
                    const kycStatus = localStorage.getItem('kycStatus');
                    if (kycStatus === 'completed') {
                        window.location.href = 'dashboard-enhanced.html';
                    } else {
                        // Show KYC reminder then go to dashboard
                        window.location.href = 'dashboard-enhanced.html?kyc=reminder';
                    }
                }, 1000);
                
            } catch (error) {
                verifyBtn.classList.remove('loading');
                verifyBtn.disabled = false;
                showNotification('The code you entered is invalid. Please check and try again.', 'error', 'Invalid Code');
                
                // Clear codes
                digits.forEach(d => {
                    d.value = '';
                    d.classList.remove('filled');
                });
                digits[0].focus();
                
                // Error haptic
                if (window.navigator.vibrate) {
                    window.navigator.vibrate([10, 100, 10, 100, 10]);
                }
            }
        }

        // Use backup code
        function useBackupCode() {
            showPrompt(
                'Enter your backup code in the format XXXX-XXXX-XXXX',
                'Use Backup Code',
                'XXXX-XXXX-XXXX',
                (backupCode) => {
                    if (backupCode && backupCode.length > 0) {
                        // Simulate verification
                        showNotification('Your backup code has been verified successfully. Logging you in...', 'success', 'Backup Code Verified');
                        setTimeout(() => {
                            window.location.href = 'dashboard-enhanced.html';
                        }, 1500);
                    }
                }
            );
        }

        // Modal Functions
        function showNotification(message, type, title) {
            const modal = document.getElementById('notificationModal');
            document.getElementById('notificationTitle').textContent = title;
            document.getElementById('notificationMessage').textContent = message;
            document.getElementById('notificationIcon').className = 'notification-icon ' + (type || '');
            modal.classList.add('active');
        }
        function closeNotificationModal() {
            document.getElementById('notificationModal').classList.remove('active');
        }
        function showPrompt(message, title, placeholder, onSubmit) {
            const modal = document.getElementById('promptModal');
            const input = document.getElementById('promptInput');
            document.getElementById('promptTitle').textContent = title;
            document.getElementById('promptMessage').textContent = message;
            input.placeholder = placeholder || '';
            input.value = '';
            document.getElementById('promptSubmitButton').onclick = () => {
                const value = input.value.trim();
                closePromptModal();
                if (onSubmit) onSubmit(value);
            };
            modal.classList.add('active');
            setTimeout(() => input.focus(), 100);
        }
        function closePromptModal() {
            document.getElementById('promptModal').classList.remove('active');
        }
    </script>
</body>
</html>
