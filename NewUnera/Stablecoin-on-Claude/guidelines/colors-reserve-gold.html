<!-- @dsCard group="Colors" viewport="700x230" subtitle="The Stablecoin signature accent — soft light yellow, on dark surfaces" name="Signal Yellow (signature)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{padding:22px;background:#fff}
  .row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .sw{flex:1;min-width:130px;border-radius:10px;border:1px solid var(--border-subtle);overflow:hidden}
  .chip{height:64px}
  .meta{padding:9px 12px}
  .nm{font-size:.78rem;font-weight:700;color:var(--text-primary)}
  .hx{font-size:.7rem;color:var(--text-secondary);font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.04em}
  .demo{background:var(--brand-deep-blue);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .demo .nav-acc{color:var(--accent);font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
  .demo .cta{background:var(--accent);color:var(--brand-deep-blue);border:none;border-radius:980px;padding:.5rem 1.1rem;font-weight:700;font-family:var(--font-body);font-size:.85rem}
  .demo .pill{background:var(--accent);color:var(--brand-deep-blue);border-radius:980px;padding:.2rem .6rem;font-size:.72rem;font-weight:700}
  .note{font-size:.72rem;margin-left:auto;color:rgba(255,255,255,.7)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="meta"><div class="nm">Signal Yellow</div><div class="hx">#ecd6a0</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--accent-strong)"></div><div class="meta"><div class="nm">Yellow strong</div><div class="hx">#ddc081</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--accent-deep)"></div><div class="meta"><div class="nm">Amber ink (on light)</div><div class="hx">#8a6a16</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="meta"><div class="nm">Yellow tint bg</div><div class="hx">38% mix</div></div></div>
  </div>
  <div class="demo">
    <span class="nav-acc">Dashboard</span>
    <button class="cta">Issue hUSD</button>
    <span class="pill">Fully backed</span>
    <span class="note">Signature accent · appears on dark surfaces</span>
  </div>
</body></html>
