<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — UNERA Stablecoin Admin</title>

    <!-- TestFoundersGrotesk — UNERA V2 brand font -->
    <style>
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../../Brand Guide/TestFoundersGrotesk-Light.otf') format('opentype'); font-weight:300; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../../Brand Guide/TestFoundersGrotesk-LightItalic.otf') format('opentype'); font-weight:300; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../../Brand Guide/TestFoundersGrotesk-Regular.otf') format('opentype'); font-weight:400; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../../Brand Guide/TestFoundersGrotesk-RegularItalic.otf') format('opentype'); font-weight:400; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../../Brand Guide/TestFoundersGrotesk-Medium.otf') format('opentype'); font-weight:500; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../../Brand Guide/TestFoundersGrotesk-MediumItalic.otf') format('opentype'); font-weight:500; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../../Brand Guide/TestFoundersGrotesk-Semibold.otf') format('opentype'); font-weight:600; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../../Brand Guide/TestFoundersGrotesk-SemiboldItalic.otf') format('opentype'); font-weight:600; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../../Brand Guide/TestFoundersGrotesk-Bold.otf') format('opentype'); font-weight:700; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url('../../Brand Guide/TestFoundersGrotesk-BoldItalic.otf') format('opentype'); font-weight:700; font-style:italic; font-display:swap; }
    </style>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* ── UNERA V2 Brand Colors ─────────────────────────── */
            --brand-deep-blue:   #173d47;
            --brand-yellow:      #ffffab;
            --brand-cloud-blue:  #ebfcf5;
            --brand-earth:       #cec4b8;
            --brand-black:       #000000;
            --brand-white:       #ffffff;
            --brand-red:         #ab5770;
            --brand-purple:      #6a5770;
            --brand-light-blue:  #90c2b8;

            /* ── Semantic aliases ─────────────────────────────── */
            --primary-green:     #173d47;
            --primary-blue:      #90c2b8;
            --accent-pink:       #ffffab;
            --neutral-900:       #173d47;
            --neutral-800:       #1e4e5a;
            --neutral-700:       #2e6374;
            --neutral-600:       #3d6b78;
            --neutral-500:       #90c2b8;
            --neutral-400:       #b8d1d6;
            --neutral-300:       #d8ecee;
            --neutral-200:       #e8f5f6;
            --neutral-100:       #f3fafb;
            --neutral-50:        #ffffff;

            /* ── Legacy gradient names: solid fills only on product HTML ── */
            --gradient-primary:  var(--brand-deep-blue);
            --gradient-sky:      color-mix(in srgb, var(--brand-cloud-blue) 50%, var(--brand-white));
            --gradient-warm:     color-mix(in srgb, var(--brand-yellow) 30%, var(--brand-white));
            --gradient-deep:     var(--brand-deep-blue);
            --gradient-ink:      var(--brand-deep-blue);
            --gradient-dusk:     var(--brand-deep-blue);

            /* ── Typography ───────────────────────────────────── */
            --font-display:      'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif;
            --font-body:         'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif;

            /* ── Financial semantic tokens ────────────────────── */
            --fin-up:            #1a7a5e;
            --fin-up-bg:         color-mix(in srgb, var(--fin-up) 12%, var(--brand-white));
            --fin-down:          var(--brand-red);
            --fin-down-bg:       color-mix(in srgb, var(--brand-red) 12%, var(--brand-white));
            --fin-neutral:       #6b9090;
            --fin-neutral-bg:    rgba(107, 144, 144, 0.10);

            /* ── Semantic status aliases ──────────────────────── */
            --success:           var(--fin-up);
            --warning:           #b8a030;
            --error:             var(--brand-red);
            --error-bg:          rgba(171, 87, 112, 0.10);

            /* ── Accessibility ────────────────────────────────── */
            --text-primary:      #173d47;
            --text-secondary:    #3d6b78;
            --border-subtle:     rgba(23, 61, 71, 0.13);
            --shadow-card:       0 2px 12px rgba(23, 61, 71, 0.07);

            /* ── Surface tints ────────────────────────────────── */
            --surface-impact:    color-mix(in srgb, var(--brand-cloud-blue) 22%, var(--brand-white));
            --surface-action:    color-mix(in srgb, var(--brand-cloud-blue) 14%, var(--brand-white));
            --surface-warm:      color-mix(in srgb, var(--brand-earth) 12%, var(--brand-white));
            --surface-sky:       color-mix(in srgb, var(--brand-cloud-blue) 18%, var(--brand-white));
            --surface-deep:      color-mix(in srgb, var(--brand-deep-blue) 4%, var(--brand-white));
            --surface-error-soft: color-mix(in srgb, var(--brand-red) 10%, var(--brand-white));
            --surface-warning-soft: color-mix(in srgb, var(--brand-yellow) 50%, var(--brand-white));

            /* ── Operator-only accent layer (purple-leaning) ───── */
            --op-nav:                  var(--brand-black);
            --op-accent:               var(--brand-purple);
            --op-accent-ink:           var(--brand-white);
            --surface-operator:        color-mix(in srgb, var(--brand-purple) 10%, var(--brand-white));
            --surface-operator-strong: color-mix(in srgb, var(--brand-purple) 18%, var(--brand-white));
            --op-icon-well:            color-mix(in srgb, var(--brand-purple) 16%, var(--brand-white));
        }

        /* ── Reduced Motion ─────────────────────────────────── */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ── Base ───────────────────────────────────────────── */
        body {
            font-family: var(--font-body);
            background: var(--surface-operator);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        /* ── Skip Link ──────────────────────────────────────── */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--brand-deep-blue);
            color: var(--brand-white);
            padding: 8px 16px;
            text-decoration: none;
            z-index: 10000;
            border-radius: 0 0 8px 0;
            font-weight: 600;
            font-size: 0.875rem;
        }
        .skip-link:focus {
            top: 0;
            outline: 3px solid var(--brand-cloud-blue);
            outline-offset: 0;
        }

        /* ── Auth Header ────────────────────────────────────── */
        .auth-header {
            background: var(--op-nav);
            padding: 0 2rem;
            height: 64px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            text-decoration: none;
            flex-shrink: 0;
        }
        .nav-brand:focus {
            outline: 3px solid var(--brand-cloud-blue);
            outline-offset: 4px;
            border-radius: 4px;
        }

        .nav-logo-img {
            height: 24px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            object-position: left center;
            display: block;
        }

        .op-pill {
            background: var(--brand-cloud-blue);
            color: var(--brand-deep-blue);
            font-family: var(--font-body);
            font-size: 0.625rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 0.125rem 0.5rem;
            border-radius: 980px;
            line-height: 1.4;
            white-space: nowrap;
            text-transform: uppercase;
        }

        /* ── Main Centering Layout ──────────────────────────── */
        .auth-body {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
        }

        /* ── Login Card ─────────────────────────────────────── */
        .login-card {
            background: var(--brand-white);
            border-radius: 1.25rem;
            padding: 2.75rem 2.5rem;
            max-width: 440px;
            width: 100%;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 8px 32px rgba(23, 61, 71, 0.09), 0 2px 8px rgba(23, 61, 71, 0.05);
        }

        /* ── Operator Badge (card) ───────────────────────────── */
        .operator-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.375rem 0.875rem;
            background: var(--op-icon-well);
            color: var(--brand-deep-blue);
            border-radius: 980px;
            font-size: 0.8125rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            margin-bottom: 1.5rem;
            border: 1px solid color-mix(in srgb, var(--brand-purple) 18%, transparent);
        }
        .operator-badge svg {
            flex-shrink: 0;
            color: var(--op-accent);
        }

        /* ── Card Text ──────────────────────────────────────── */
        .login-title {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            color: var(--brand-deep-blue);
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.9375rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        /* ── Form ───────────────────────────────────────────── */
        .form-group {
            margin-bottom: 1.375rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.4375rem;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border-subtle);
            border-radius: 0.75rem;
            font-size: 1rem;
            font-family: var(--font-body);
            color: var(--text-primary);
            background: var(--brand-white);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input::placeholder {
            color: var(--neutral-400);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--brand-deep-blue);
            box-shadow: 0 0 0 3px rgba(23, 61, 71, 0.12);
        }

        /* ── Primary Button ─────────────────────────────────── */
        .btn-primary {
            width: 100%;
            min-height: 46px;
            padding: 0.75rem 1.5rem;
            background: var(--op-accent);
            color: var(--brand-white);
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            transition: filter 0.2s, box-shadow 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            letter-spacing: 0.01em;
        }
        .btn-primary:hover {
            filter: brightness(0.9);
            box-shadow: 0 4px 14px rgba(106, 87, 112, 0.3);
        }
        .btn-primary:active {
            transform: translateY(1px);
            filter: brightness(0.85);
        }
        .btn-primary:focus {
            outline: 2px solid var(--op-accent);
            outline-offset: 3px;
        }

        /* ── Security Note ───────────────────────────────────── */
        .security-note {
            margin-top: 1.375rem;
            padding: 0.875rem 1rem;
            background: color-mix(in srgb, var(--brand-purple) 8%, var(--brand-white));
            border: 1px solid color-mix(in srgb, var(--brand-purple) 18%, transparent);
            border-radius: 0.75rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: flex;
            align-items: flex-start;
            gap: 0.625rem;
            line-height: 1.5;
        }
        .security-note svg {
            flex-shrink: 0;
            margin-top: 0.05em;
            color: var(--op-accent);
        }

        /* ── Back Link ───────────────────────────────────────── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            margin-top: 1.25rem;
            transition: color 0.2s;
            border-radius: 4px;
        }
        .back-link:hover {
            color: var(--brand-deep-blue);
        }
        .back-link:focus {
            outline: 2px solid var(--brand-deep-blue);
            outline-offset: 2px;
        }
        .back-link svg {
            flex-shrink: 0;
            transform: scaleX(-1);
        }

        /* ── Divider ─────────────────────────────────────────── */
        .card-divider {
            border: none;
            border-top: 1px solid var(--border-subtle);
            margin: 1.5rem 0 0;
        }

        /* ── Error State ─────────────────────────────────────── */
        .form-error {
            display: none;
            font-size: 0.8125rem;
            color: var(--error);
            margin-top: 0.375rem;
            font-weight: 500;
        }
        .form-error.visible {
            display: block;
        }
        .form-input.input-error {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(171, 87, 112, 0.12);
        }

        /* ── Responsive ──────────────────────────────────────── */
        @media (max-width: 480px) {
            .auth-header {
                padding: 0 1.25rem;
            }
            .auth-body {
                padding: 1.5rem 1rem;
                align-items: flex-start;
                padding-top: 2rem;
            }
            .login-card {
                padding: 2rem 1.5rem;
            }
            .login-title {
                font-size: 1.625rem;
            }
            .form-input {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Skip link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Auth Header — brand identity before login -->
    <header class="auth-header" role="banner">
        <a href="../index.html" class="nav-brand" aria-label="UNERA Stablecoin Admin home">
            <img src="../NewLogo/Unera White Text Nav.svg" alt="UNERA" class="nav-logo-img" height="24">
            <span class="op-pill" aria-label="UNERA Stablecoin Admin portal">UNERA STABLECOIN ADMIN</span>
        </a>
    </header>

    <!-- Main -->
    <main id="main-content" class="auth-body">
        <div class="login-card" role="region" aria-label="UNERA Stablecoin Admin login">

            <!-- Operator badge -->
            <div class="operator-badge" aria-hidden="true">
                <!-- verified_user FILL=1 — Material Symbols Outlined -->
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
                    <path d="m438-338 226-226-57-57-169 169-84-84-57 57 141 141Zm42 258q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Z"/>
                </svg>
                Operator Portal
            </div>

            <h1 class="login-title">UNERA Stablecoin Admin Access</h1>
            <p class="login-subtitle">Secure login for authorised operators only</p>

            <form id="operatorLoginForm" onsubmit="handleLogin(event)" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">Admin Email</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="admin@unera.io"
                        required
                        autocomplete="email"
                        aria-describedby="email-error"
                        aria-required="true"
                    >
                    <span id="email-error" class="form-error" role="alert" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                        aria-describedby="password-error"
                        aria-required="true"
                    >
                    <span id="password-error" class="form-error" role="alert" aria-live="polite"></span>
                </div>

                <button type="submit" class="btn-primary">
                    Sign In
                </button>
            </form>

            <!-- Security note -->
            <div class="security-note" role="note">
                <!-- lock FILL=1 — Material Symbols Outlined -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
                    <path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm296.5-223.5Q560-327 560-360t-23.5-56.5Q513-440 480-440t-56.5 23.5Q400-393 400-360t23.5 56.5Q447-280 480-280t56.5-23.5ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"/>
                </svg>
                <span>2FA authentication will be required after login for enhanced account security.</span>
            </div>

            <hr class="card-divider" aria-hidden="true">

            <!-- Back link -->
            <a href="../index.html" class="back-link">
                <!-- arrow_forward FILL=0 (flipped via scaleX(-1)) — Material Symbols Outlined -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
                    <path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z"/>
                </svg>
                Back to homepage
            </a>

        </div>
    </main>

    <script>
        function clearErrors() {
            ['email', 'password'].forEach(function(id) {
                var input = document.getElementById(id);
                var error = document.getElementById(id + '-error');
                if (input) { input.classList.remove('input-error'); }
                if (error) { error.textContent = ''; error.classList.remove('visible'); }
            });
        }

        function showError(fieldId, message) {
            var input = document.getElementById(fieldId);
            var error = document.getElementById(fieldId + '-error');
            if (input) { input.classList.add('input-error'); }
            if (error) { error.textContent = message; error.classList.add('visible'); }
        }

        function handleLogin(event) {
            event.preventDefault();
            clearErrors();

            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var valid = true;

            if (!email) {
                showError('email', 'Please enter your admin email address.');
                valid = false;
            }
            if (!password) {
                showError('password', 'Please enter your password.');
                valid = false;
            }

            if (!valid) { return; }

            localStorage.setItem('operatorAuth', 'true');
            localStorage.setItem('operatorEmail', email);
            window.location.href = 'dashboard.html';
        }

        // Redirect if already authenticated
        if (localStorage.getItem('operatorAuth') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
