<!-- @dsCard group="Colors" viewport="700x180" subtitle="P&L direction — split from brand decoration" name="Financial semantics" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{padding:22px;background:#fff}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .sw{flex:1;min-width:150px;border-radius:14px;border:1px solid var(--border-subtle);overflow:hidden}
  .chip{height:56px;display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums}
  .meta{padding:9px 12px}
  .nm{font-size:.78rem;font-weight:700;color:var(--text-primary)}
  .hx{font-size:.7rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--fin-up-bg);color:var(--fin-up)">+250.00</div><div class="meta"><div class="nm">fin-up · gains, inflows, completed</div><div class="hx">#1a7a5e</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--fin-down-bg);color:var(--fin-down)">−100.00</div><div class="meta"><div class="nm">fin-down · losses, outflows</div><div class="hx">#ab5770</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--fin-neutral-bg);color:var(--fin-neutral)">0.00</div><div class="meta"><div class="nm">fin-neutral · flat</div><div class="hx">#6b9090</div></div></div>
  </div>
</body></html>
