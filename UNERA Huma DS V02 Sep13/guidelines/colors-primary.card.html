<!-- @dsCard group="Colors" viewport="700x180" name="Primary Brand" subtitle="Deep Blue anchor · Yellow accent (dark only) · Cloud Blue warmth" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:20px; }
  .row { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .sw { border-radius:var(--radius-md); height:104px; display:flex; flex-direction:column; justify-content:flex-end; padding:12px; border:1px solid var(--border-subtle); }
  .name { font-size:12px; font-weight:600; }
  .hex { font-family:var(--font-mono); font-size:11px; opacity:0.75; margin-top:2px; }
  .light .name, .light .hex { color:var(--brand-white); }
  .dark .name, .dark .hex { color:var(--brand-deep-blue); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw light" style="background:var(--brand-deep-blue)"><span class="name">Deep Blue</span><span class="hex">#173D47</span></div>
    <div class="sw dark" style="background:var(--brand-yellow)"><span class="name">Yellow</span><span class="hex">#FFFFAB</span></div>
    <div class="sw dark" style="background:var(--brand-cloud-blue)"><span class="name">Cloud Blue</span><span class="hex">#EBFCF5</span></div>
    <div class="sw light" style="background:var(--brand-black)"><span class="name">Black</span><span class="hex">#000000</span></div>
    <div class="sw dark" style="background:var(--brand-white)"><span class="name">White</span><span class="hex">#FFFFFF</span></div>
  </div>
</body>
</html>
