<!-- @dsCard group="Colors" viewport="700x170" name="Status & Gradients" subtitle="Status aliases + specimen-only gradients (never on product UI)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:20px; }
  .grp { display:flex; gap:8px; margin-bottom:10px; }
  .chip { flex:1; height:46px; border-radius:var(--radius-sm); display:flex; align-items:center; padding:0 12px; font-size:12px; font-weight:600; color:#fff; border:1px solid var(--border-subtle); }
  .gr { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .gc { height:54px; border-radius:var(--radius-sm); display:flex; align-items:flex-end; padding:7px; font-size:10px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.3); }
</style>
</head>
<body>
  <div class="grp">
    <div class="chip" style="background:var(--success)">success</div>
    <div class="chip" style="background:var(--warning)">warning</div>
    <div class="chip" style="background:var(--error)">error</div>
  </div>
  <div class="gr">
    <div class="gc" style="background:var(--gradient-primary)">primary</div>
    <div class="gc" style="background:var(--gradient-warm);color:#173d47;text-shadow:none">warm</div>
    <div class="gc" style="background:var(--gradient-sky);color:#173d47;text-shadow:none">sky</div>
    <div class="gc" style="background:var(--gradient-deep)">deep</div>
  </div>
</body>
</html>
