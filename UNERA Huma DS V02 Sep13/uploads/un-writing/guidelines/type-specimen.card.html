<!-- @dsCard group="Type" viewport="700x230" name="TestFoundersGrotesk" subtitle="One grotesk for display + body · Oakes Grotesk fallback" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:24px; color:var(--brand-deep-blue); }
  .top { display:flex; align-items:baseline; gap:24px; }
  .aa { font-size:84px; font-weight:700; line-height:1; letter-spacing:-0.015em; }
  .meta { font-size:12px; color:var(--text-secondary); }
  .meta b { color:var(--brand-deep-blue); }
  .chars { font-size:20px; margin-top:16px; letter-spacing:0.01em; }
  .chars .light { font-weight:300; }
</style>
</head>
<body>
  <div class="top">
    <div class="aa">Aa</div>
    <div class="meta">
      <div style="font-size:18px;font-weight:600;color:var(--brand-deep-blue)">TestFoundersGrotesk</div>
      <div style="margin-top:4px">Display &amp; body · brand intent <b>Oakes Grotesk</b></div>
      <div style="margin-top:2px">Light 300 → Bold 700 · normal + italic</div>
    </div>
  </div>
  <div class="chars">ABCDEFGHIJKLMNOPQRSTUVWXYZ 1234567890</div>
  <div class="chars light">abcdefghijklmnopqrstuvwxyz &amp; ($€¥) <span style="font-style:italic">italic</span></div>
</body>
</html>
