<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Storage - Testing Tool</title>
    <style>
        /* ── TestFoundersGrotesk - Huma V2 brand font ─────────────────────────── */
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../fonts/TestFoundersGrotesk-Light.otf") format('opentype'); font-weight:300; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../fonts/TestFoundersGrotesk-LightItalic.otf") format('opentype'); font-weight:300; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../fonts/TestFoundersGrotesk-Regular.otf") format('opentype'); font-weight:400; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../fonts/TestFoundersGrotesk-RegularItalic.otf") format('opentype'); font-weight:400; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../fonts/TestFoundersGrotesk-Medium.otf") format('opentype'); font-weight:500; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../fonts/TestFoundersGrotesk-MediumItalic.otf") format('opentype'); font-weight:500; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../fonts/TestFoundersGrotesk-Semibold.otf") format('opentype'); font-weight:600; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../fonts/TestFoundersGrotesk-SemiboldItalic.otf") format('opentype'); font-weight:600; font-style:italic; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../fonts/TestFoundersGrotesk-Bold.otf") format('opentype'); font-weight:700; font-style:normal; font-display:swap; }
        @font-face { font-family:'TestFoundersGrotesk'; src:url("../fonts/TestFoundersGrotesk-BoldItalic.otf") format('opentype'); font-weight:700; font-style:italic; font-display:swap; }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brand-deep-blue:   #173d47;
            --brand-yellow:      #ffffab;
            --brand-cloud-blue:  #ebfcf5;
            --brand-earth:       #cec4b8;
            --brand-black:       #000000;
            --brand-white:       #ffffff;
            --brand-red:         #ab5770;
            --brand-purple:      #6a5770;
            --brand-light-blue:  #90c2b8;

            --primary-green:     #173d47;
            --primary-blue:      #90c2b8;
            --accent-pink:       #ffffab;
            --neutral-900:       #173d47;
            --neutral-800:       #1e4e5a;
            --neutral-700:       #2e6374;
            --neutral-600:       #3d6b78;
            --neutral-500:       #90c2b8;
            --neutral-400:       #b8d1d6;
            --neutral-300:       #d8ecee;
            --neutral-200:       #e8f5f6;
            --neutral-100:       #f3fafb;
            --neutral-50:        #ffffff;

            --gradient-primary:  var(--brand-deep-blue);
            --gradient-sky:      color-mix(in srgb, var(--brand-cloud-blue) 50%, var(--brand-white));
            --gradient-warm:     color-mix(in srgb, var(--brand-yellow) 30%, var(--brand-white));
            --gradient-deep:     var(--brand-deep-blue);
            --gradient-ink:      var(--brand-deep-blue);

            --font-display:      'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif;
            --font-body:         'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif;

            --fin-up:            #1a7a5e;
            --fin-up-bg:         color-mix(in srgb, var(--fin-up) 12%, var(--brand-white));
            --fin-down:          var(--brand-red);
            --fin-down-bg:       color-mix(in srgb, var(--brand-red) 12%, var(--brand-white));
            --fin-neutral:       #6b9090;
            --fin-neutral-bg:    rgba(107, 144, 144, 0.10);

            --success:           var(--fin-up);
            --warning:           #b8a030;
            --error:             var(--brand-red);
            --error-bg:          rgba(171, 87, 112, 0.10);

            --text-primary:      #173d47;
            --text-secondary:    #3d6b78;
            --border-subtle:     rgba(23, 61, 71, 0.13);
            --shadow-card:       0 2px 12px rgba(23, 61, 71, 0.07);

            --surface-impact:    color-mix(in srgb, var(--brand-cloud-blue) 22%, var(--brand-white));
            --surface-action:    color-mix(in srgb, var(--brand-cloud-blue) 14%, var(--brand-white));
            --surface-warm:      color-mix(in srgb, var(--brand-earth) 12%, var(--brand-white));
            --surface-sky:       color-mix(in srgb, var(--brand-cloud-blue) 18%, var(--brand-white));
            --surface-deep:      color-mix(in srgb, var(--brand-deep-blue) 4%, var(--brand-white));
            --surface-warning-soft: color-mix(in srgb, var(--brand-yellow) 50%, white);
            --surface-error-soft:   color-mix(in srgb, var(--brand-red) 10%, white);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ── Skip Link ─────────────────────────────────────────── */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--brand-deep-blue);
            color: var(--brand-white);
            padding: 8px 16px;
            text-decoration: none;
            z-index: 10000;
            border-radius: 0 0 8px 0;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.875rem;
        }
        .skip-link:focus { top: 0; outline: 3px solid var(--brand-yellow); }

        /* ── Layout ────────────────────────────────────────────── */
        body {
            font-family: var(--font-body);
            background: var(--brand-cloud-blue);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── Container card ────────────────────────────────────── */
        .container {
            background: var(--brand-white);
            border-radius: 1.25rem;
            padding: 2.5rem;
            max-width: 600px;
            width: 100%;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
        }

        /* ── Title ─────────────────────────────────────────────── */
        .page-title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.625rem;
            margin-bottom: 0.375rem;
        }

        .page-title-icon {
            width: 36px;
            height: 36px;
            background: var(--surface-action);
            border-radius: 0.625rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--brand-deep-blue);
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--brand-deep-blue);
            text-align: center;
            line-height: 1.2;
            font-family: var(--font-display);
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 1.75rem;
            font-size: 0.9375rem;
            font-family: var(--font-body);
        }

        /* ── Storage info panel ────────────────────────────────── */
        .storage-info {
            background: var(--surface-action);
            border-radius: 1rem;
            padding: 1.375rem;
            margin-bottom: 1.75rem;
            border: 1px solid var(--border-subtle);
        }

        .storage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.625rem 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .storage-item:last-child {
            border-bottom: none;
        }

        .storage-key {
            font-family: var(--font-body);
            font-size: 0.875rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        .storage-value {
            font-family: var(--font-body);
            font-size: 0.8125rem;
            color: var(--text-secondary);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 1.5rem;
            font-size: 0.9375rem;
            font-family: var(--font-body);
        }

        /* ── Actions grid ──────────────────────────────────────── */
        .actions {
            display: grid;
            gap: 0.875rem;
            margin-bottom: 1.5rem;
        }

        /* ── Buttons ───────────────────────────────────────────── */
        .btn {
            padding: 0.875rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.25s;
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 46px;
            width: 100%;
        }
        .btn:focus {
            outline: 3px solid rgba(23, 61, 71, 0.3);
            outline-offset: 2px;
        }

        .btn-danger {
            background: var(--brand-red);
            color: var(--brand-white);
            box-shadow: 0 2px 8px rgba(171, 87, 112, 0.25);
        }
        .btn-danger:hover {
            background: color-mix(in srgb, var(--brand-red) 85%, var(--brand-black));
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(171, 87, 112, 0.35);
        }

        .btn-warning {
            background: var(--warning);
            color: var(--brand-white);
            box-shadow: 0 2px 8px rgba(184, 160, 48, 0.25);
        }
        .btn-warning:hover {
            background: color-mix(in srgb, var(--warning) 85%, var(--brand-black));
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(184, 160, 48, 0.35);
        }

        .btn-secondary {
            background: var(--brand-white);
            color: var(--text-secondary);
            border: 1.5px solid var(--border-subtle);
        }
        .btn-secondary:hover {
            border-color: var(--brand-deep-blue);
            color: var(--brand-deep-blue);
            background: var(--surface-deep);
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--fin-up);
            color: var(--brand-white);
            box-shadow: 0 2px 8px rgba(26, 122, 94, 0.25);
        }
        .btn-success:hover {
            background: color-mix(in srgb, var(--fin-up) 85%, var(--brand-black));
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(26, 122, 94, 0.35);
        }

        /* ── Quick tests panel ─────────────────────────────────── */
        .quick-tests {
            background: var(--surface-action);
            border: 1.5px solid rgba(23, 61, 71, 0.14);
            border-radius: 1rem;
            padding: 1.375rem;
            margin-bottom: 1.5rem;
        }

        .quick-tests-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-size: 0.9375rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-body);
        }

        .quick-test-btn {
            padding: 0.75rem 1.25rem;
            border-radius: 0.625rem;
            background: var(--brand-white);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 0.5rem;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-body);
            min-height: 44px;
        }
        .quick-test-btn:hover {
            background: var(--surface-action);
            border-color: var(--brand-deep-blue);
            color: var(--brand-deep-blue);
        }
        .quick-test-btn:focus {
            outline: 2px solid var(--brand-deep-blue);
            outline-offset: 2px;
        }
        .quick-test-btn:last-child { margin-bottom: 0; }

        /* ── Warning box ───────────────────────────────────────── */
        .warning-box {
            background: var(--surface-error-soft);
            border: 1px solid color-mix(in srgb, var(--brand-red) 30%, transparent);
            border-radius: 0.75rem;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-primary);
            display: flex;
            align-items: flex-start;
            gap: 0.625rem;
            font-family: var(--font-body);
            line-height: 1.6;
        }
        .warning-box svg { flex-shrink: 0; margin-top: 0.125rem; color: var(--brand-red); }

        /* ── Count badge ───────────────────────────────────────── */
        .count-badge {
            background: var(--brand-deep-blue);
            color: var(--brand-white);
            padding: 0.1875rem 0.625rem;
            border-radius: 1rem;
            font-size: 0.8125rem;
            font-weight: 600;
            font-family: var(--font-body);
        }

        /* ── Toast ─────────────────────────────────────────────── */
        .toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: var(--brand-deep-blue);
            color: var(--brand-white);
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 8px 24px rgba(23, 61, 71, 0.2);
            font-weight: 600;
            z-index: 10010;
            animation: slideIn 0.3s ease-out;
            display: none;
            font-family: var(--font-body);
            font-size: 0.9375rem;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to   { transform: translateX(0); opacity: 1; }
        }

        /* ── Responsive ────────────────────────────────────────── */
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .container { padding: 2rem 1.5rem; border-radius: 1rem; }
            h1 { font-size: 1.5rem; }
        }

        @media (max-width: 480px) {
            .container { padding: 1.5rem 1.25rem; }
            h1 { font-size: 1.375rem; }
        }
    </style>
</head>

    <main id="main-content">
        <div class="container">

                <div class="page-title-icon" aria-hidden="true">
                    <!-- science FILL=1 -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" width="20" height="20" aria-hidden="true"><path d="M208-120q-51 0-79-35.5T108-241l212-315v-204h-40q-17 0-28.5-11.5T240-800q0-17 11.5-28.5T280-840h400q17 0 28.5 11.5T720-800q0 17-11.5 28.5T680-760h-40v204l212 315q21 31 19 66.5T839.5-120H208Zm0-80h544L547-480H413L208-200Zm164-320h216v-240H372v240Zm-164 320h544-544Zm220-240h-4 4Z"/></svg>

    <div class="toast" id="toast"></div>

    <script>
        // Display current storage
        function refreshDisplay() {
            const container = document.getElementById('storageInfo');
            const keys = Object.keys(localStorage);
            
            if (keys.length === 0) {
                container.innerHTML = '<div class="empty-state">Storage is empty. Ready for testing.</div>';
                return;
            }

            let html = '';
            keys.forEach(key => {
                const value = localStorage.getItem(key);
                html += `
                    <div class="storage-item">
                        <span class="storage-key">${key}</span>
                        <span class="storage-value" title="${value}">${value}</span>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Clear all storage
        function clearAll() {
            showConfirmation(
                'Clear ALL localStorage and sessionStorage? This action cannot be undone.',
                'Clear All Storage',
                () => {
                    localStorage.clear();
                    sessionStorage.clear();
                    showToast('✓ All storage cleared!');
                    refreshDisplay();
                }
            );
        }
        
        // Modal Functions
        function showConfirmation(message, title, onConfirm) {
            const modalHTML = `
                <div class="modal-overlay" id="confirmationModal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10010;">
                    <div style="background: white; border-radius: 1.25rem; max-width: 400px; width: 90%; padding: 2rem; text-align: center; box-shadow: 0 20px 40px rgba(23,61,71,0.2);">
                        <h2 style="margin-bottom: 1rem; font-family: 'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif; color: #173d47; font-size: 1.25rem; font-weight: 700;">${title}</h2>
                        <p style="color: #3d6b78; line-height: 1.6; font-family: 'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif;">${message}</p>
                        <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                            <button onclick="closeConfirmationModal()" style="flex: 1; padding: 0.875rem; background: #e8f5f6; color: #173d47; border: 1px solid rgba(23,61,71,0.13); border-radius: 0.75rem; cursor: pointer; font-family: 'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif; font-weight: 600; min-height: 46px; font-size: 1rem;">Cancel</button>
                            <button id="confirmBtn" style="flex: 1; padding: 0.875rem; background: #173d47; color: white; border: none; border-radius: 0.75rem; cursor: pointer; font-family: 'TestFoundersGrotesk', 'Oakes Grotesk', sans-serif; font-weight: 600; min-height: 46px; font-size: 1rem;">Confirm</button>
                        </div>
                    </div>
                </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
            document.getElementById('confirmBtn').onclick = () => {
                closeConfirmationModal();
                if (onConfirm) onConfirm();
            };
        }
        function closeConfirmationModal() {
            const modal = document.getElementById('confirmationModal');
            if (modal) modal.remove();
        }

        // Clear wallet-related items only
        function clearWalletOnly() {
            const walletKeys = [
                'walletAddress',
                'walletCreated',
                'walletCreatedDate',
                'walletCreationReturn',
                'visited_convert',
                'visited_donate',
                'visited_send',
                'walletBannerDismissed'
            ];
            
            walletKeys.forEach(key => localStorage.removeItem(key));
            showToast('✓ Wallet data cleared!');
            refreshDisplay();
        }

        // Test scenarios
        function testFirstTimeConvert() {
            clearWalletOnly();
            showToast('✓ Ready for first-time convert test!');
            setTimeout(() => {
                window.location.href = 'convert.html';
            }, 1500);
        }

        function testFirstTimeDonate() {
            clearWalletOnly();
            showToast('✓ Ready for first-time donate test!');
            setTimeout(() => {
                window.location.href = 'send-enhanced.html?mode=donate';
            }, 1500);
        }

        function testFirstTimeSend() {
            clearWalletOnly();
            showToast('✓ Ready for first-time send test!');
            setTimeout(() => {
                window.location.href = 'send-enhanced.html';
            }, 1500);
        }

        function testDashboardBanner() {
            clearWalletOnly();
            showToast('✓ Ready for dashboard banner test!');
            setTimeout(() => {
                window.location.href = 'dashboard-enhanced.html';
            }, 1500);
        }

        function testReturningUser() {
            // Set all visited flags but no wallet
            localStorage.setItem('visited_convert', 'true');
            localStorage.setItem('visited_donate', 'true');
            localStorage.setItem('visited_send', 'true');
            showToast('✓ Ready for returning user test (no banners)!');
            refreshDisplay();
        }

        // Show toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-out forwards';
                setTimeout(() => {
                    toast.style.display = 'none';
                    toast.style.animation = 'slideIn 0.3s ease-out';
                }, 300);
            }, 3000);
        }

        // Add slideOut animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(400px);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Initialize on load
        document.addEventListener('DOMContentLoaded', refreshDisplay);

        // Auto-refresh every 2 seconds
        setInterval(refreshDisplay, 2000);
    </script>
</body>
</html>
