<!-- @dsCard group="Colors" viewport="700x150" name="Surface Tints" subtitle="White canvas + per-card color-mix() tints · never flat grey, never rainbow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:20px; }
  .row { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; }
  .sw { height:88px; border-radius:var(--radius-md); border:1px solid var(--border-subtle); display:flex; align-items:flex-end; padding:9px; }
  .name { font-size:10.5px; font-weight:600; color:var(--text-primary); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--surface-impact)"><span class="name">impact</span></div>
    <div class="sw" style="background:var(--surface-action)"><span class="name">action</span></div>
    <div class="sw" style="background:var(--surface-warm)"><span class="name">warm</span></div>
    <div class="sw" style="background:var(--surface-sky)"><span class="name">sky</span></div>
    <div class="sw" style="background:var(--surface-cad-hub)"><span class="name">cad-hub</span></div>
    <div class="sw" style="background:var(--surface-deep)"><span class="name">deep</span></div>
  </div>
</body>
</html>
