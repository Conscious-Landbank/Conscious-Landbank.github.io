<!-- @dsCard group="Type" viewport="700x180" name="KPI Figures" subtitle="Stat size 2.5rem with tabular numerals — money outcomes carry direction" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:24px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  .kpi { }
  .val { font-family:var(--font-display); font-size:var(--font-stat-size); font-weight:700; line-height:1; font-variant-numeric:tabular-nums; color:var(--text-primary); }
  .lbl { font-size:0.938rem; color:var(--text-secondary); font-weight:600; margin-top:8px; }
  .trend { display:inline-flex; align-items:center; gap:5px; margin-top:10px; padding:5px 11px; border-radius:var(--radius-pill); font-size:12px; font-weight:700; background:var(--fin-up-bg); color:var(--fin-up); }
  svg { width:13px; height:13px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="kpi">
      <div class="val">$10,240</div>
      <div class="lbl">Total Portfolio</div>
      <span class="trend"><svg viewBox="0 -960 960 960" fill="currentColor"><path d="M440-160v-487L216-423l-56-57 320-320 320 320-56 57-224-224v487h-80Z"/></svg>+$2,400</span>
    </div>
    <div class="kpi">
      <div class="val">$486.50</div>
      <div class="lbl">Yield Generated</div>
      <span class="trend"><svg viewBox="0 -960 960 960" fill="currentColor"><path d="M440-160v-487L216-423l-56-57 320-320 320 320-56 57-224-224v487h-80Z"/></svg>+$42</span>
    </div>
    <div class="kpi">
      <div class="val">1,240+</div>
      <div class="lbl">Lives Impacted</div>
      <span class="trend" style="background:var(--fin-neutral-bg);color:var(--fin-neutral)">Growing daily</span>
    </div>
  </div>
</body>
</html>
