<!-- @dsCard group="Brand" viewport="700x150" subtitle="The 44px Deep Blue spine — wordmark + STABLECOIN pill, gold active link" name="Nav spine" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{padding:0;background:#fff}
  .nav{background:var(--brand-deep-blue);height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
  .left{display:flex;align-items:center;gap:2.5rem}
  .brand{display:flex;align-items:center;gap:.5rem}
  .brand img{height:22px}
  .pill{background:var(--brand-cloud-blue);color:var(--brand-deep-blue);font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.125rem .5rem;border-radius:980px}
  .links{display:flex;gap:1.3rem;list-style:none}
  .links a{font-size:.72rem;font-weight:500;letter-spacing:.04em;color:rgba(255,255,255,.85);text-decoration:none}
  .links a.active{color:var(--reserve-gold);font-weight:600}
  .bell{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75)}
  .av{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--reserve-gold) 60%,var(--brand-earth));color:var(--brand-deep-blue);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700}
  .note{padding:18px 22px;font-size:.78rem;color:var(--text-secondary)}
</style></head>
<body>
  <nav class="nav">
    <div class="left">
      <div class="brand"><img src="../assets/logos/unera-white-text-nav.svg" alt="UNERA"><span class="pill">Stablecoin</span></div>
      <ul class="links"><li><a class="active">DASHBOARD</a></li><li><a>PURCHASE</a></li><li><a>REDEEM</a></li><li><a>POR</a></li><li><a>HISTORY</a></li></ul>
    </div>
    <div style="display:flex;align-items:center;gap:.9rem">
      <span class="bell"><svg width="18" height="18" viewBox="0 -960 960 960" fill="currentColor"><path d="M160-200v-80h80v-280q0-83 50-147.5T420-792v-28q0-25 17.5-42.5T480-880q25 0 42.5 17.5T540-820v28q80 20 130 84.5T720-560v280h80v80H160Z"/></svg></span>
      <span class="av">JS</span>
    </div>
  </nav>
  <div class="note">Identical on every screen. Active &amp; hover links go Reserve Gold; focus rings on the nav are gold; the STABLECOIN pill marks the Portal.</div>
</body></html>
