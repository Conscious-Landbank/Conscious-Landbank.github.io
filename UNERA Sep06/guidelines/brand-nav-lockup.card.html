<!-- @dsCard group="Brand" viewport="700x200" name="Nav Lockup" subtitle="Wordmark in the product nav · exact account-settings.html bar" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--neutral-100); padding:22px; }

  /* Verbatim from account-settings.html / consumer-app nav */
  .nav { background:var(--brand-deep-blue); padding:0 2.75rem; height:44px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.08); border-radius:10px; }
  .nav-left { display:flex; align-items:center; gap:1.5rem; }
  .nav-right { display:flex; align-items:center; gap:0.75rem; }
  .nav-brand { display:flex; align-items:center; gap:0.5rem; text-decoration:none; }
  .nav-logo-img { height:24px; width:auto; object-fit:contain; object-position:left center; display:block; }
  .nav-links { display:flex; gap:1.375rem; list-style:none; align-items:center; }
  .nav-links li { display:flex; align-items:center; }
  .nav-link { color:rgba(255,255,255,0.85); text-decoration:none; font-size:0.75rem; font-weight:500; letter-spacing:0.02em; padding:0.5rem; border-radius:4px; display:inline-flex; align-items:center; gap:0.25rem; min-height:44px; text-transform:uppercase; background:none; border:none; cursor:pointer; font-family:var(--font-body); }
  .nav-link:hover { color:var(--brand-yellow); }
  .nav-link.active { color:var(--brand-yellow); font-weight:600; }
  .nav-dropdown-chevron { width:16px; height:16px; fill:currentColor; }

  .notification-bell-btn { width:36px; height:36px; border-radius:50%; border:none; background:transparent; position:relative; display:flex; align-items:center; justify-content:center; }
  .notif-bell-icon { width:20px; height:20px; color:rgba(255,255,255,0.85); }
  .notif-badge { min-width:18px; height:18px; padding:0 3px; border-radius:9px; position:absolute; top:0; right:0; background:var(--brand-yellow); color:var(--brand-deep-blue); font-size:0.625rem; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid var(--brand-deep-blue); }

  .nav-wallet-display { display:flex; align-items:center; gap:0.3125rem; padding:0.125rem 0.375rem 0.125rem 0.25rem; background:var(--brand-white); border:1px solid var(--border-subtle); border-radius:980px; box-shadow:0 1px 4px rgba(23,61,71,0.08); }
  .nav-wallet-avatar { position:relative; width:28px; height:28px; flex-shrink:0; }
  .user-avatar-nav { width:28px; height:28px; font-size:0.75rem; border-radius:50%; background:var(--brand-deep-blue); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-weight:600; }
  .nav-wallet-metamask-badge { position:absolute; bottom:-1px; right:-1px; width:12px; height:12px; font-size:7px; display:flex; align-items:center; justify-content:center; background:#F6851B; border-radius:50%; border:2px solid #fff; }
  .nav-wallet-info { display:flex; flex-direction:column; min-width:0; padding:0.0625rem 0.125rem; cursor:pointer; border-radius:0.375rem; transition:background 0.15s; }
  .nav-wallet-info:hover { background:var(--neutral-100); }
  .nav-wallet-address-row { display:inline-flex; align-items:center; gap:0.125rem; }
  .nav-wallet-address { font-size:0.75rem; font-weight:600; line-height:1.2; white-space:nowrap; }
  .nav-wallet-chevron { width:12px; height:12px; flex-shrink:0; opacity:0.55; }
  .nav-wallet-balance { font-size:0.6875rem; line-height:1.2; color:var(--text-secondary); white-space:nowrap; }
  .nav-network-badge { display:flex; align-items:center; gap:0.25rem; padding:0.25rem 0.5rem; margin-left:0.125rem; background:var(--neutral-200); border-radius:0.5rem; border:none; }
  .nav-network-icon { width:14px; height:14px; color:#627EEA; flex-shrink:0; }
  .nav-network-badge span { font-size:0.6875rem; font-weight:600; color:var(--text-secondary); }
  .nav-network-chevron { width:12px; height:12px; color:var(--text-secondary); }

  .note { margin-top:14px; font-size:12px; color:var(--text-secondary); line-height:1.5; }
  .note b { color:var(--text-primary); }
</style>
</head>
<body>
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav-left">
      <a href="#" class="nav-brand" aria-label="Huma Home"><img src="../assets/logos/huma-white-text-nav.svg" alt="Huma" class="nav-logo-img" height="24"></a>
      <ul class="nav-links" role="list">
        <li><a href="#" class="nav-link">DASHBOARD</a></li>
        <li><a href="#" class="nav-link">WALLET</a></li>
        <li><button type="button" class="nav-link" aria-haspopup="true">TRANSACT
          <svg class="nav-dropdown-chevron" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M480-345 240-585l56-56 184 184 184-184 56 56-240 240Z"/></svg>
        </button></li>
        <li><a href="#" class="nav-link">CENTERS</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <button type="button" class="notification-bell-btn" aria-label="Notifications, 3 unread">
        <svg class="notif-bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/></svg>
        <span class="notif-badge">3</span>
      </button>
      <div class="nav-wallet-display" aria-label="Account menu">
        <div class="nav-wallet-avatar">
          <div class="user-avatar-nav">JS</div>
          <span class="nav-wallet-metamask-badge" aria-hidden="true">🦊</span>
        </div>
        <div class="nav-wallet-info nav-wallet-trigger" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false" aria-label="Open account menu">
          <span class="nav-wallet-address-row">
            <span class="nav-wallet-address">0x0822...7B75</span>
            <svg class="nav-wallet-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </span>
          <span class="nav-wallet-balance">2,500.00 hUSD</span>
        </div>
        <div class="nav-network-badge" role="button" aria-label="Switch network, currently Ethereum">
          <svg class="nav-network-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.944 17.97L4.58 13.62 11.943 24l7.37-10.38-7.372 4.35h.003zM12.056 0L4.69 12.223l7.365 4.354 7.365-4.35L12.056 0z"/></svg>
          <span>Ethereum</span>
          <svg class="nav-network-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
    </div>
  </nav>
  <p class="note">The nav wordmark sits <b>24px tall</b> in the sticky <b>44px Deep Blue bar</b>: teal arc (<b>#6CC6B8</b>) + white wordmark. Links are <b>uppercase</b>, white at 85% opacity, going <b>Yellow</b> on hover/active. See the <b>Navigation</b> component for full states.</p>
</body>
</html>
