<!-- @dsCard group="Consumer App" viewport="1280x720" name="Consumer App" subtitle="Dashboard · Wallet · Send flow · Humanity Centres — click-through" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNERA — Consumer App</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="consumer-app.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  .skip-link { position: absolute; }
  /* Connect modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(23,61,71,0.45); display: flex; align-items: center; justify-content: center; z-index: 10010; padding: 1rem; }
  .modal-box { background: #fff; border-radius: var(--radius-card); padding: 1.75rem; max-width: 420px; width: 100%; box-shadow: var(--shadow-modal); }
  .modal-title { font-family: var(--font-display); font-size: var(--fs-card-title); font-weight: var(--fw-bold); margin-bottom: 0.375rem; }
  .modal-desc { font-size: var(--fs-sm); color: var(--text-secondary); margin-bottom: 1.25rem; }
  .wallet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
  .wallet-opt { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 1.1rem 0.5rem; border: 2px solid var(--border-subtle); border-radius: var(--radius-md); background: #fff; cursor: pointer; font-family: var(--font-body); transition: border-color var(--dur-base), background var(--dur-base); }
  .wallet-opt:hover { border-color: var(--brand-deep-blue); background: rgba(23,61,71,0.02); }
  .wallet-opt-glyph { font-size: 1.75rem; }
  .wallet-opt-name { font-size: var(--fs-sm); font-weight: var(--fw-semibold); }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to main content</a>
<div id="root"></div>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
  const { useState } = React;
  function App() {
    const [active, setActive] = useState("dashboard");
    const [connected, setConnected] = useState(false);
    const [modal, setModal] = useState(false);

    function nav(key) { setActive(key); window.scrollTo({ top: 0 }); }
    function connect() { setConnected(true); setModal(false); setActive("wallet"); window.scrollTo({ top: 0 }); }

    const Screen = { dashboard: Dashboard, wallet: Wallet, centres: Centres, send: SendFlow, notifications: Notifications }[active] || Dashboard;
    return (
      <React.Fragment>
        <Nav active={active} onNav={nav} connected={connected} onConnect={() => setModal(true)} />
        <main id="main"><Screen onNav={nav} /></main>
        {modal && (
          <div className="modal-overlay" onClick={() => setModal(false)}>
            <div className="modal-box" onClick={e => e.stopPropagation()}>
              <div className="modal-title">Connect a wallet</div>
              <div className="modal-desc">Connect to hold value, transact and donate. Your keys, your control.</div>
              <div className="wallet-grid">
                <button className="wallet-opt" onClick={connect}><span className="wallet-opt-glyph">🦊</span><span className="wallet-opt-name">MetaMask</span></button>
                <button className="wallet-opt" onClick={connect}><span className="wallet-opt-glyph">🔗</span><span className="wallet-opt-name">WalletConnect</span></button>
                <button className="wallet-opt" onClick={connect}><span className="wallet-opt-glyph">🔵</span><span className="wallet-opt-name">Coinbase</span></button>
                <button className="wallet-opt" onClick={connect}><span className="wallet-opt-glyph">✉️</span><span className="wallet-opt-name">Email / social</span></button>
              </div>
              <button className="btn btn-secondary btn-block" onClick={() => setModal(false)}>Cancel</button>
            </div>
          </div>
        )}
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
