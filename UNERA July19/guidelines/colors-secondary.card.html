<!-- @dsCard group="Colors" viewport="700x180" name="Secondary Brand" subtitle="Red/mauve · Earth · Purple · Light Blue — semantic, never decorative" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:20px; }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .sw { border-radius:var(--radius-md); height:104px; display:flex; flex-direction:column; justify-content:flex-end; padding:12px; border:1px solid var(--border-subtle); }
  .name { font-size:12px; font-weight:600; color:var(--brand-white); }
  .hex { font-family:var(--font-mono); font-size:11px; color:rgba(255,255,255,0.8); margin-top:2px; }
  .dark .name { color:var(--brand-deep-blue); } .dark .hex { color:var(--text-secondary); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--brand-red)"><span class="name">Red / Mauve</span><span class="hex">#AB5770</span></div>
    <div class="sw dark" style="background:var(--brand-earth)"><span class="name">Earth</span><span class="hex">#CEC4B8</span></div>
    <div class="sw" style="background:var(--brand-purple)"><span class="name">Purple</span><span class="hex">#6A5770</span></div>
    <div class="sw dark" style="background:var(--brand-light-blue)"><span class="name">Light Blue</span><span class="hex">#90C2B8</span></div>
  </div>
</body>
</html>
