<!-- @dsCard group="Spacing" viewport="700x190" name="Shadows" subtitle="Resting card → hover lift → popover / menu / modal" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:28px 24px; }
  .row { display:flex; gap:22px; }
  .item { text-align:center; }
  .box { width:120px; height:80px; background:var(--brand-white); border:1px solid var(--border-subtle); border-radius:var(--radius-card); }
  .lbl { font-family:var(--font-mono); font-size:10.5px; color:var(--text-secondary); margin-top:12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-card)"></div><div class="lbl">card</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-hover)"></div><div class="lbl">hover</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-menu)"></div><div class="lbl">menu</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-pop)"></div><div class="lbl">pop</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-modal)"></div><div class="lbl">modal</div></div>
  </div>
</body>
</html>
