<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Huma — Design System Thumbnail</title>
<link rel="stylesheet" href="styles.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1280px;height:854px;display:flex;overflow:hidden;background:var(--brand-deep-blue, #173d47);}
.main{flex:1;display:flex;align-items:center;justify-content:center;}
.main img{width:62%;height:auto;display:block;}
.swatches{width:25%;height:854px;display:flex;flex-direction:column;}
.swatches div{flex:1;}
</style>
</head>
<body>
<div class="main"><img src="assets/logos/huma-white-text.svg" alt="Huma"></div>
<div class="swatches">
<div style="background:#ffffab;"></div>
<div style="background:#ebfcf5;"></div>
<div style="background:#90c2b8;"></div>
<div style="background:#ab5770;"></div>
</div>
</body>
</html>
