<!-- @dsCard group="Components" viewport="700x760" name="Core" subtitle="Button · Badge · Card · Avatar · Wallet toolbar & asset buttons · Stepper" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--brand-white); margin: 0; padding: 24px; color: var(--text-primary); }
  .group { margin-bottom: 22px; }
  .glabel { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); margin-bottom: 12px; }
  .rowflex { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .cardgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

  /* ── Wallet activity toolbar + portfolio asset buttons (verbatim wallet-enhanced.html) ── */
  .filter-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.875rem 1.5rem; background: var(--neutral-50); border: 2px solid var(--border-subtle); border-radius: 980px; font-family: var(--font-body); font-size: 1rem; font-weight: 600; color: var(--text-primary); cursor: pointer; transition: all 0.2s; }
  .filter-btn svg { width: 20px; height: 20px; fill: currentColor; }
  .filter-btn:hover { border-color: var(--brand-deep-blue); background: rgba(23,61,71,0.05); }
  .filter-btn.active { background: var(--brand-deep-blue); border-color: var(--brand-deep-blue); color: #fff; }
  .filter-count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 5px; background: var(--brand-yellow); color: var(--brand-deep-blue); border: 1.5px solid var(--brand-deep-blue); border-radius: 11px; font-size: 0.75rem; font-weight: 700; margin-left: 0.25rem; line-height: 1; }
  .export-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.25rem; background: var(--brand-deep-blue); color: #fff; border: none; border-radius: 980px; font-family: var(--font-body); font-size: 0.938rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .export-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .export-btn:hover { background: var(--neutral-800); }
  .filter-chip { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.5rem 1rem; background: rgba(23,61,71,0.1); border: 2px solid var(--brand-deep-blue); border-radius: 980px; font-size: 0.875rem; color: var(--brand-deep-blue); font-weight: 600; }
  .filter-chip > button { background: none; border: none; color: inherit; cursor: pointer; padding: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background 0.2s; }
  .filter-chip > button svg { width: 14px; height: 14px; fill: currentColor; }
  .filter-chip > button:hover { background: rgba(23,61,71,0.2); }
  .filter-chip-clear-all { background: none; border: 2px solid var(--neutral-300); color: var(--text-secondary); font-weight: 600; padding: 0.5rem 1rem; border-radius: 980px; cursor: pointer; font-size: 0.875rem; transition: all 0.2s; font-family: var(--font-body); }
  .filter-chip-clear-all:hover { border-color: var(--brand-deep-blue); color: var(--brand-deep-blue); }
  .scope-tab { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.5rem 1rem; border-radius: 980px; border: 2px solid var(--border-subtle); background: var(--brand-white); color: var(--text-secondary); font-family: var(--font-body); font-size: 0.875rem; font-weight: 600; cursor: pointer; }
  .scope-tab.active { background: var(--brand-deep-blue); border-color: var(--brand-deep-blue); color: #fff; }
  .asset-action-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem; min-height: 30px; padding: 0.3rem 0.625rem; background: var(--neutral-50); border: 2px solid var(--border-subtle); border-radius: 0.625rem; color: var(--text-secondary); cursor: pointer; transition: all 0.2s cubic-bezier(0.4,0,0.2,1); font-family: var(--font-body); font-size: 0.8125rem; font-weight: 600; }
  .asset-action-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .asset-action-btn:hover { background: #fff; border-color: var(--brand-deep-blue); color: var(--brand-deep-blue); transform: translateY(-3px); box-shadow: 0 6px 16px rgba(23,61,71,0.25); }
  .load-more-btn { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.625rem 1.25rem; background: transparent; border: 2px solid var(--border-subtle); border-radius: 980px; font-family: var(--font-body); font-size: 0.875rem; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
  .load-more-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .load-more-btn:hover { border-color: var(--brand-deep-blue); color: var(--brand-deep-blue); }
  .privacy-toggle { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.25rem; background: var(--neutral-50); border: 2px solid var(--border-subtle); border-radius: 980px; cursor: pointer; font-size: 0.875rem; font-weight: 600; color: var(--text-secondary); font-family: var(--font-body); }
  .privacy-toggle svg { width: 20px; height: 20px; }
  .privacy-toggle:hover { border-color: var(--brand-deep-blue); background: rgba(23,61,71,0.05); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, Badge, Card, Avatar, Stepper } = window.UNERADesignSystem_679671;
  const Bolt = () => <svg viewBox="0 -960 960 960" fill="currentColor"><path d="m393-165 279-335H492l36-286-253 366h154l-36 255Z"/></svg>;
  const FilterIcon = () => <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M440-120v-240h80v80h320v80H520v80h-80Zm-320-80v-80h240v80H120Zm160-160v-80H120v-80h160v-80h80v240h-80Zm160-80v-80h400v80H440Zm160-160v-240h80v80h160v80H680v80h-80Zm-480-80v-80h400v80H120Z"/></svg>;
  const XIcon = () => <svg viewBox="0 -960 960 960" fill="currentColor"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>;
  const ExportIcon = () => <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg>;
  const Plus = () => <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>;
  const Redeem = () => <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M440-160v-326L216-262l-57-57 321-321 321 321-57 57-224-224v326h-80Z"/></svg>;
  const SendArrow = () => <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z"/></svg>;
  const Swap = () => <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M320-440v-287L217-624l-57-56 200-200 200 200-57 56-103-103v287h-80ZM600-80 400-280l57-56 103 103v-287h80v287l103-103 57 56L600-80Z"/></svg>;
  const Chevron = () => <svg viewBox="0 -960 960 960" fill="currentColor"><path d="M480-345 240-585l56-56 184 184 184-184 56 56-240 240Z"/></svg>;
  const Eye = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19 12 19c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 5c4.756 0 8.773 2.662 10.065 7A10.524 10.524 0 0112 19c-1.473 0-2.891-.292-4.21-.818M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M3 3l18 18"/></svg>;

  function Demo() {
    return (
      <div>
        <div className="group">
          <div className="glabel">Button</div>
          <div className="rowflex">
            <Button variant="primary">Continue</Button>
            <Button variant="secondary">Cancel</Button>
            <Button variant="accent" icon={<Bolt/>}>Get hCAD</Button>
            <Button variant="primary" size="sm">Small</Button>
            <Button variant="primary" disabled>Disabled</Button>
          </div>
        </div>

        <div className="group">
          <div className="glabel">Badge</div>
          <div className="rowflex">
            <Badge variant="up">+$2,400 this month</Badge>
            <Badge variant="down">−$180</Badge>
            <Badge variant="neutral">Growing daily</Badge>
            <Badge variant="warning">Pending</Badge>
            <Badge variant="success">Completed</Badge>
            <Badge variant="solid">Ethereum</Badge>
          </div>
        </div>

        <div className="group">
          <div className="glabel">Avatar — user identity is initials (per account-settings); wallet identity is a blockie</div>
          <div className="rowflex" style={{gap:'20px'}}>
            <div style={{textAlign:'center'}}><Avatar initials="JS" size="xl" /><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:6}}>xl · 80 · account</div></div>
            <div style={{textAlign:'center'}}><Avatar initials="JS" size="lg" /><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:6}}>lg · 48 · dropdown</div></div>
            <div style={{textAlign:'center'}}><Avatar initials="JS" size="md" /><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:6}}>md · 32 · nav</div></div>
            <div style={{textAlign:'center'}}><Avatar blockie size="sm" badge="🦊" /><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:6}}>sm · 28 · wallet</div></div>
          </div>
        </div>

        <div className="group">
          <div className="glabel">Card — surface tints</div>
          <div className="cardgrid">
            <Card surface="impact" interactive accent style={{padding:'1.25rem'}}>
              <div style={{fontFamily:'var(--font-display)',fontSize:'2rem',fontWeight:700,lineHeight:1}}>$10,240</div>
              <div style={{color:'var(--text-secondary)',fontSize:'.875rem',marginTop:4}}>Total Portfolio</div>
            </Card>
            <Card surface="warm" interactive style={{padding:'1.25rem'}}>
              <div style={{fontWeight:600}}>Donate</div>
              <div style={{color:'var(--text-secondary)',fontSize:'.875rem',marginTop:4}}>Support a center</div>
            </Card>
            <Card surface="inverse" style={{padding:'1.25rem'}}>
              <div style={{fontWeight:600}}>Buy Stablecoins</div>
              <div style={{opacity:.7,fontSize:'.875rem',marginTop:4}}>hUSD · USDC · USDT</div>
            </Card>
          </div>
        </div>

        <div className="group">
          <div className="glabel">Wallet activity toolbar — search · filter (with count badge) · scope tabs · export</div>
          <div className="rowflex">
            <button className="filter-btn"><FilterIcon/><span>Filters</span></button>
            <button className="filter-btn active"><FilterIcon/><span>Filters</span><span className="filter-count-badge">2</span></button>
            <button className="scope-tab active">All wallets</button>
            <button className="scope-tab">Main</button>
            <button className="scope-tab">Savings</button>
            <button className="export-btn"><ExportIcon/><span>Export</span></button>
          </div>
        </div>

        <div className="group">
          <div className="glabel">Active filter chips — removable ✕ · clear-all</div>
          <div className="rowflex">
            <span className="filter-chip">Received<button aria-label="Remove Received filter"><XIcon/></button></span>
            <span className="filter-chip">On-chain<button aria-label="Remove On-chain filter"><XIcon/></button></span>
            <span className="filter-chip">hUSD<button aria-label="Remove hUSD filter"><XIcon/></button></span>
            <button className="filter-chip-clear-all">Clear all</button>
          </div>
        </div>

        <div className="group">
          <div className="glabel">Portfolio asset mini-buttons — per-row Issue · Redeem · Send · Exchange · See more · privacy</div>
          <div className="rowflex">
            <button className="asset-action-btn"><Plus/>Issue</button>
            <button className="asset-action-btn"><Redeem/>Redeem</button>
            <button className="asset-action-btn"><SendArrow/>Send</button>
            <button className="asset-action-btn"><Swap/>Exchange</button>
            <button className="load-more-btn">See more<Chevron/></button>
            <button className="privacy-toggle"><Eye/>Show Balances</button>
          </div>
        </div>

        <div className="group">
          <div className="glabel">Stepper</div>
          <Stepper steps={["Amount","Recipient","Review","Done"]} current={2} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
