<!-- @dsCard group="Colors" viewport="700x130" name="Neutral Ramp" subtitle="Teal-tinted neutrals derived from Deep Blue · text uses --text-secondary" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:20px; }
  .strip { display:flex; height:72px; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--border-subtle); }
  .sw { flex:1; display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px; font-size:9.5px; font-weight:600; }
</style>
</head>
<body>
  <div class="strip">
    <div class="sw" style="background:var(--neutral-900);color:#fff">900</div>
    <div class="sw" style="background:var(--neutral-800);color:#fff">800</div>
    <div class="sw" style="background:var(--neutral-700);color:#fff">700</div>
    <div class="sw" style="background:var(--neutral-600);color:#fff">600</div>
    <div class="sw" style="background:var(--neutral-500);color:#173d47">500</div>
    <div class="sw" style="background:var(--neutral-400);color:#173d47">400</div>
    <div class="sw" style="background:var(--neutral-300);color:#173d47">300</div>
    <div class="sw" style="background:var(--neutral-200);color:#173d47">200</div>
    <div class="sw" style="background:var(--neutral-100);color:#173d47">100</div>
  </div>
</body>
</html>
