<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:22px; color:var(--brand-deep-blue); }
  .w { display:flex; align-items:baseline; justify-content:space-between; padding:5px 0; }
  .word { font-size:26px; }
  .lbl { font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); }
</style>
</head>
<body>
  <div class="w"><span class="word" style="font-weight:300">Stability with meaning</span><span class="lbl">Light 300</span></div>
  <div class="w"><span class="word" style="font-weight:400">Stability with meaning</span><span class="lbl">Regular 400</span></div>
  <div class="w"><span class="word" style="font-weight:500">Stability with meaning</span><span class="lbl">Medium 500</span></div>
  <div class="w"><span class="word" style="font-weight:600">Stability with meaning</span><span class="lbl">Semibold 600</span></div>
  <div class="w"><span class="word" style="font-weight:700">Stability with meaning</span><span class="lbl">Bold 700</span></div>
</body>
</html>
