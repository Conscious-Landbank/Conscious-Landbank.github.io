<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing Scale" subtitle="4 / 8 / 12 / 16 / 20 / 24 / 32 / 40 / 48 / 64 px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:var(--font-body); background:var(--brand-white); padding:24px; }
  .row { display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .bar { background:var(--brand-deep-blue); height:14px; border-radius:3px; }
  .lbl { font-family:var(--font-mono); font-size:10.5px; color:var(--text-secondary); width:110px; flex-shrink:0; }
</style>
</head>
<body>
  <div class="row"><span class="lbl">--space-1 · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="lbl">--space-2 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="lbl">--space-3 · 12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="lbl">--space-4 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="lbl">--space-6 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="lbl">--space-8 · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="lbl">--space-10 · 40</span><div class="bar" style="width:40px"></div></div>
  <div class="row"><span class="lbl">--space-12 · 48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="lbl">--space-16 · 64</span><div class="bar" style="width:64px"></div></div>
</body>
</html>
