<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>HP responsive audit</title>
<style>body{font-family:ui-monospace,monospace;font-size:12px;padding:12px}iframe{border:1px solid #ccc;display:block;margin-bottom:8px}#log{white-space:pre-wrap}</style></head>
<body><div id="log">running…</div><div id="stage"></div>
<script>
/* Kevin matrix: 360/375/390/393/402/414 phones + 768 tablet.
   Checks: horizontal overflow, tap targets under 44px (info icons count their padded hit area), open tooltips inside the viewport. */
const WIDTHS=[360,375,390,393,402,414,768,834,1024,1280];
const logEl=document.getElementById('log');const out=[];
function say(s){out.push(s);console.log('[AUDIT] '+s);logEl.textContent=out.join('\n');}
function path(el){let p=el.tagName.toLowerCase();if(el.id)p+='#'+el.id;else if(el.classList.length)p+='.'+[...el.classList].slice(0,2).join('.');return p;}
function vis(win,el){const cs=win.getComputedStyle(el);if(cs.display==='none'||cs.visibility==='hidden')return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function audit(f,w,scope){const d=f.contentDocument,win=f.contentWindow,de=d.documentElement;const sw=Math.max(de.scrollWidth,d.body.scrollWidth);const res={};
 if(sw>w+2){const off=[];d.querySelectorAll('body *').forEach(el=>{const r=el.getBoundingClientRect();if(r.right>w+2&&r.width>8&&vis(win,el))off.push(path(el)+' r='+Math.round(r.right));});res.overflow='sw='+sw+' '+[...new Set(off)].slice(0,4).join(' | ');}
 const root=scope?d.querySelector(scope):d.body;if(root){const small=[];root.querySelectorAll('button,a.btn,[role="button"],[role="radio"],[role="tab"]').forEach(el=>{if(!vis(win,el))return;if(el.closest('.flow-demo-bar,nav,.mobile-drawer,.demo-btns'))return;const r=el.getBoundingClientRect();let h=r.height,wd=r.width;if(el.classList.contains('fee-info-btn')){const a=win.getComputedStyle(el,'::after');if(a.content&&a.content!=='none'){h+=24;wd+=24;}}if(h<43.5||(el.classList.contains('fee-info-btn')&&wd<43.5))small.push(path(el)+' '+Math.round(wd)+'x'+Math.round(h));});if(small.length)res.targets=[...new Set(small)].slice(0,4).join(' | ');}
 const tips=[];d.querySelectorAll('.fee-tooltip').forEach(t=>{if(!vis(win,t))return;const r=t.getBoundingClientRect();if(r.left<0||r.right>w)tips.push('tooltip L='+Math.round(r.left)+' R='+Math.round(r.right));});if(tips.length)res.tips=tips.join(' | ');
 return res;}
const click=(d,sel)=>{const e=d.querySelector(sel);if(e)e.click();return !!e;};
const pill=(d,grp,v)=>{const b=[...d.querySelectorAll(grp+' .demo-btn')].find(b=>b.dataset.v===v);if(b)b.click();};
/* Put a real HP row into the visible page column so its info icon is measured at true geometry. */
function injectDonate(d,win){const host=d.querySelector('#main-content .container, #main-content, main');const box=d.createElement('div');box.className='summary-rows';box.style.margin='1rem 0';box.innerHTML='<div class="summary-row"><span class="summary-row-label">Huma Points'+win.__hpInfo()+'</span><span class="summary-row-value">≈ 250 HP</span></div>';host.insertBefore(box,host.firstChild.nextSibling);const b=box.querySelector('.fee-info-btn');b.focus();b.click();}
function injectExchange(d){const src=d.getElementById('confirmHp').closest('.confirm-detail');const host=d.querySelector('main');const box=d.createElement('div');box.className='confirm-section';box.appendChild(src.cloneNode(true));host.insertBefore(box,host.firstChild.nextSibling);const b=box.querySelector('.fee-info-btn');b.click();}
const PAGES=[
 ['huma-points.html','rewards',d=>{},'#main-content'],
 ['huma-points.html','rewards-tooltip',d=>{d.querySelector('#tabRewards .fee-info-btn').click();},'#tabRewards'],
 ['huma-points.html','about',d=>click(d,'#tabBtnAbout'),'#tabAbout'],
 ['huma-points.html','history',d=>click(d,'#tabBtnHistory'),'#tabHistory'],
 ['huma-points.html','claim-form',d=>click(d,'#claimAllBtn'),'#claimOverlay'],
 ['huma-points.html','claim-newwallet',d=>{click(d,'#claimAllBtn');click(d,'[data-w="new"]');},'#claimOverlay'],
 ['huma-points.html','claim-sign',async d=>{click(d,'#claimAllBtn');click(d,'[data-w="new"]');click(d,'#claimSubmitBtn');await wait(200);},'#claimOverlay'],
 ['huma-points.html','sign-cancelled',async d=>{pill(d,'#hpDataPills','sign_reject');click(d,'#claimAllBtn');click(d,'[data-w="new"]');click(d,'#claimSubmitBtn');await wait(1900);},'#claimOverlay'],
 ['huma-points.html','claim-done',async d=>{click(d,'#claimAllBtn');click(d,'#claimSubmitBtn');await wait(1500);},'#claimOverlay'],
 ['huma-points.html','claim-fail',async d=>{pill(d,'#hpDataPills','claim_fail');click(d,'#claimAllBtn');click(d,'#claimSubmitBtn');await wait(1500);},'#claimOverlay'],
 ['huma-points.html','claim-timeout',async d=>{pill(d,'#hpDataPills','timeout');click(d,'#claimAllBtn');click(d,'#claimSubmitBtn');await wait(2000);},'#claimOverlay'],
 ['huma-points.html','detail',d=>{click(d,'#tabBtnHistory');click(d,'#histList [data-detail]');},'#claimDetailOverlay'],
 ['huma-points.html','calc',d=>pill(d,'#hpDataPills','calc'),'#tabRewards'],
 ['huma-points.html','unavailable',d=>pill(d,'#hpDataPills','unavailable'),'#main-content'],
 ['huma-points.html','no-rewards',d=>pill(d,'#hpUserPills','none'),'#main-content'],
 ['huma-points.html','logged-out',d=>pill(d,'#hpUserPills','out'),'#main-content'],
 ['wallet-enhanced.html','wallet-hp-box',d=>{},'#huma-points-balance'],
 ['account-settings.html','settings-hp-card',d=>{},'#huma-points'],
 ['wallet-edge.html','wallet-edge-hp-box',d=>{},'#huma-points-balance'],
 ['exchange.html','swap-hp-tooltip',d=>injectExchange(d),null],
 ['donate.html','donate-hp-tooltip',(d,win)=>injectDonate(d,win),null],
 ['dashboard-enhanced.html','dashboard',d=>{},null],
 ['donations.html','donations',d=>{},null]
];
async function run(){const stage=document.getElementById('stage');let fails=0,n=0;
 for(const w of WIDTHS){for(const [pg,name,fn,scope] of PAGES){n++;
  const f=document.createElement('iframe');f.width=w;f.height=1100;f.src=pg;
  stage.innerHTML='';stage.appendChild(f);
  await new Promise(r=>{f.onload=r;setTimeout(r,5000);});
  await wait(300);
  try{await fn(f.contentDocument,f.contentWindow);}catch(e){say(w+' '+name+' STATE-ERR '+e.message);fails++;}
  await wait(350);
  if(!f.contentDocument||!f.contentDocument.body){await wait(1500);}
  let res;try{res=audit(f,w,scope);}catch(e){say(w+' '+name+' AUDIT-ERR '+e.message);fails++;continue;}
  if(res.overflow||res.targets||res.tips){fails++;say('FAIL '+w+' '+name+(res.overflow?'\n  OVERFLOW '+res.overflow:'')+(res.targets?'\n  TARGETS '+res.targets:'')+(res.tips?'\n  TOOLTIP '+res.tips:''));}
 }}
 say('DONE '+n+' combos, '+fails+' failing');
}
run();
</script></body></html>
