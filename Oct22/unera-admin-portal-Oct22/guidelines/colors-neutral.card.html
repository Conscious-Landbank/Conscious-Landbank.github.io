<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-body);color:var(--text-primary);background:#fff;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}.sw i{display:block;height:44px;border-radius:8px;border:1px solid var(--line)}.sw b{font-weight:600;font-size:12px}.sw span{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}</style></head><body><div class="row"><div class="sw" style="min-width:56px"><i style="background:var(--n-900)"></i><b>900</b></div><div class="sw" style="min-width:56px"><i style="background:var(--n-800)"></i><b>800</b></div><div class="sw" style="min-width:56px"><i style="background:var(--n-700)"></i><b>700</b></div><div class="sw" style="min-width:56px"><i style="background:var(--n-600)"></i><b>600</b></div><div class="sw" style="min-width:56px"><i style="background:var(--n-500)"></i><b>500</b></div><div class="sw" style="min-width:56px"><i style="background:var(--n-400)"></i><b>400</b></div><div class="sw" style="min-width:56px"><i style="background:var(--n-300)"></i><b>300</b></div><div class="sw" style="min-width:56px"><i style="background:var(--n-200)"></i><b>200</b></div><div class="sw" style="min-width:56px"><i style="background:var(--n-100)"></i><b>100</b></div><div class="sw" style="min-width:56px"><i style="background:var(--n-50)"></i><b>50</b></div></div></body></html>
