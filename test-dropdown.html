<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dropdown</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: sans-serif;
            padding: 20px;
        }
        
        .test-container {
            position: relative;
            display: inline-block;
        }
        
        .test-button {
            padding: 10px 20px;
            background: #10B981;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .test-button:hover {
            background: #059669;
        }
        
        .test-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 300px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            display: none;
            z-index: 1000;
        }
        
        .test-dropdown.show {
            display: block;
        }
        
        .dropdown-option {
            padding: 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        
        .dropdown-option:hover {
            background: #f5f5f5;
        }
        
        .dropdown-option:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h1>Dropdown Test</h1>
    <p>If this button works, we'll replicate the solution to dashboard:</p>
    <br><br>
    
    <div class="test-container">
        <button class="test-button" id="testBtn">CLICK ME</button>
        
        <div class="test-dropdown" id="testDropdown">
            <div class="dropdown-option">MetaMask</div>
            <div class="dropdown-option">WalletConnect</div>
        </div>
    </div>
    
    <div id="log" style="margin-top: 40px; padding: 20px; background: #f5f5f5; border-radius: 8px; font-family: monospace; font-size: 12px;"></div>
    
    <script>
        const log = document.getElementById('log');
        function addLog(msg) {
            log.innerHTML += msg + '<br>';
            console.log(msg);
        }
        
        addLog('Script loaded');
        
        const btn = document.getElementById('testBtn');
        const dropdown = document.getElementById('testDropdown');
        
        addLog('Button found: ' + (btn ? 'YES' : 'NO'));
        addLog('Dropdown found: ' + (dropdown ? 'YES' : 'NO'));
        
        if (btn && dropdown) {
            btn.addEventListener('click', function(e) {
                addLog('Button clicked!');
                e.stopPropagation();
                
                const isShowing = dropdown.classList.contains('show');
                addLog('Dropdown is currently: ' + (isShowing ? 'VISIBLE' : 'HIDDEN'));
                
                if (isShowing) {
                    dropdown.classList.remove('show');
                    addLog('Dropdown HIDDEN');
                } else {
                    dropdown.classList.add('show');
                    addLog('Dropdown SHOWN');
                }
            });
            
            addLog('Event listener attached successfully');
        }
        
        // Close on outside click
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.test-container')) {
                if (dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                    addLog('Dropdown closed by outside click');
                }
            }
        });
    </script>
</body>
</html>
