<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;font-family:var(--font-body);background:#fff;color:var(--text-primary)}.g{margin-bottom:18px}.l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:8px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window[Object.keys(window).find(k => window[k] && window[k].ReasonCodeField)] || {};
const { Input, Select, ReasonCodeField, Tabs } = NS;
function Demo(){ const [tab,setTab]=React.useState('wallets'); const [r,setR]=React.useState(''); const [n,setN]=React.useState('');
return <div>
  <div className="g"><div className="l">Tabs</div><Tabs items={[{value:'overview',label:'Overview'},{value:'wallets',label:'Wallets',count:2},{value:'tx',label:'Transactions',count:148},{value:'hp',label:'Huma Points'},{value:'audit',label:'Audit history'}]} value={tab} onChange={setTab} /></div>
  <div className="g"><div className="l">Input · Select</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}><Input label="Wallet address" mono placeholder="0x…" hint="Ethereum, Polygon or Base" /><Select label="Chain" options={['Ethereum','Polygon','Base']} placeholder="Select chain" /><Input label="Minimum qualifying volume" suffix="USD" defaultValue="50.00" /><Input label="Display order" type="number" error="Must be a whole number" defaultValue="2.5" /></div></div>
  <div className="g"><div className="l">ReasonCodeField</div><ReasonCodeField codes={['Duplicate issuance','Wrong rate applied','Wrong amount','Wrong attribution wallet']} reason={r} notes={n} onReasonChange={setR} onNotesChange={setN} notesRequired /></div>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
