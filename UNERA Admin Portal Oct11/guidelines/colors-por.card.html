<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-body);color:var(--text-primary);background:#fff;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}.sw i{display:block;height:44px;border-radius:8px;border:1px solid var(--line)}.sw b{font-weight:600;font-size:12px}.sw span{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--por-bank)"></i><b>Bank deposits</b><span>var(--por-bank)</span></div><div class="sw"><i style="background:var(--por-treasury)"></i><b>US Treasuries</b><span>var(--por-treasury)</span></div><div class="sw"><i style="background:var(--por-stable)"></i><b>Stablecoins</b><span>var(--por-stable)</span></div><div class="sw"><i style="background:var(--por-cash)"></i><b>Cash equivalents</b><span>var(--por-cash)</span></div></div></body></html>
