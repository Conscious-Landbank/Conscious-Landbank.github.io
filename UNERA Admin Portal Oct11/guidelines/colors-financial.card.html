<!-- @dsCard group="Colors" viewport="700x150" subtitle="Money direction only. Never brand decoration. Always paired with sign or icon" name="Financial semantics" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px 20px;font-family:var(--font-body);color:var(--text-primary);background:#fff;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}.sw i{display:block;height:44px;border-radius:8px;border:1px solid var(--line)}.sw b{font-weight:600;font-size:12px}.sw span{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--fin-up)"></i><b>fin-up</b><span>#1a7a5e · inflow, +</span></div><div class="sw"><i style="background:var(--fin-down)"></i><b>fin-down</b><span>#ab5770 · outflow, −</span></div><div class="sw"><i style="background:var(--fin-neutral)"></i><b>fin-neutral</b><span>#6b9090 · flat</span></div><div style="margin-left:auto;font-variant-numeric:tabular-nums;text-align:right;line-height:1.7"><div style="color:var(--fin-up);font-weight:600">+1,200.00 hUSD</div><div style="color:var(--fin-down);font-weight:600">−350.00 USDC</div><div style="color:var(--text-primary);font-weight:500">1,200.00 hUSD</div></div></div></body></html>
