<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication - UNERA</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Enhanced Auth CSS -->
    <link rel="stylesheet" href="auth-enhanced.css">
    
    <!-- Code Input Handler -->
    <script src="code-input-handler.js" defer></script>
    
    <style>
        .code-input-group {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin: 1.5rem 0;
        }
        
        .code-digit {
            width: 48px;
            height: 56px;
            font-size: 1.75rem;
            font-weight: 700;
            text-align: center;
            border: 2px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            font-family: var(--font-body);
            transition: all var(--transition-base);
        }
        
        .code-digit:focus {
            border-color: var(--primary-green);
            outline: 2px solid var(--primary-green);
            outline-offset: 2px;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }
        
        .code-digit.filled {
            background: rgba(16, 185, 129, 0.05);
            border-color: var(--primary-green);
        }
        
        @media (max-width: 640px) {
            .code-digit {
                width: 48px;
                height: 56px;
                font-size: 1.5rem;
            }
            .code-input-group {
                gap: 0.5rem;
            }
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            display: block;
            background: white;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
        }
        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
        }
        .modal-body { padding: 1.5rem; }
        .notification-modal .modal-body {
            text-align: center;
            padding: 2rem 1.5rem;
        }
        .notification-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #10B981 0%, #0EA5E9 100%);
            color: white;
            font-size: 2rem;
        }
        .notification-icon.error {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
        }
        .notification-icon.warning {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
        }
        .notification-icon.info {
            background: linear-gradient(135deg, #0EA5E9 0%, #3B82F6 100%);
        }
        .notification-message {
            font-size: 1rem;
            line-height: 1.6;
            color: #475569;
            margin: 0;
        }
        .modal-footer {
            padding: 1.5rem;
            border-top: 1px solid #E2E8F0;
        }
        .notification-modal .modal-footer {
            padding: 0 1.5rem 1.5rem 1.5rem;
            border-top: none;
        }
    </style>
</head>
<body>
    <!-- Skip Link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <svg class="logo-icon" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
                <circle cx="70" cy="70" r="60" fill="#14B8A6"/>
                <circle cx="70" cy="70" r="45" fill="#2DD4BF"/>
                <circle cx="70" cy="70" r="30" fill="#5EEAD4"/>
                <circle cx="70" cy="70" r="15" fill="#FFFFFF"/>
            </svg>
            <span class="logo-text">UNERA</span>
        </div>
        <a href="login_2.html" class="back-btn">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back
        </a>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <rect x="5" y="11" width="14" height="10" rx="2"/>
                        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                    </svg>
                </div>
                <h1 class="auth-title">Two-Factor Authentication</h1>
                <p class="auth-subtitle">Enter the code from your <span id="methodText">authenticator app</span></p>
            </div>

            <!-- Code Input -->
            <div class="code-input-group">
                <input type="text" maxlength="1" class="code-digit" id="digit1" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="code-digit" id="digit2" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="code-digit" id="digit3" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="code-digit" id="digit4" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="code-digit" id="digit5" inputmode="numeric" autocomplete="off">
                <input type="text" maxlength="1" class="code-digit" id="digit6" inputmode="numeric" autocomplete="off">
            </div>

            <!-- Trust This Device -->
            <div class="checkbox-group" style="margin-bottom: 1.5rem; justify-content: center;">
                <input type="checkbox" id="trustDevice" class="checkbox-input">
                <label for="trustDevice" class="checkbox-label">Trust this device for 30 days</label>
            </div>

            <button class="submit-btn" id="verifyBtn" onclick="verify2FA()">
                Verify & Continue
            </button>

            <!-- Help Links -->
            <div style="text-align: center; margin-top: 2rem; font-size: 0.875rem;">
                <p style="color: var(--text-secondary); margin-bottom: 0.75rem;">Having trouble?</p>
                <div style="display: flex; justify-content: center; gap: 1.5rem;">
                    <a href="#" class="auth-link" onclick="useBackupCode(); return false;">Use backup code</a>
                    <a href="#" class="auth-link" onclick="showNotification('For assistance, please contact our support team at support@unera.io', 'info', 'Contact Support'); return false;">Contact support</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Custom Notification Modal -->
    <div class="modal-overlay" id="notificationModal" role="dialog" aria-modal="true">
        <div class="modal notification-modal">
            <div class="modal-header">
                <h2 id="notificationTitle" class="modal-title">Notification</h2>
                <button class="modal-close" onclick="closeNotificationModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="notification-icon" id="notificationIcon">✓</div>
                <p class="notification-message" id="notificationMessage"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="closeNotificationModal()" style="width: 100%;">OK</button>
            </div>
        </div>
    </div>

    <!-- Custom Prompt Modal -->
    <div class="modal-overlay" id="promptModal" role="dialog" aria-modal="true">
        <div class="modal notification-modal">
            <div class="modal-header">
                <h2 id="promptTitle" class="modal-title">Input Required</h2>
                <button class="modal-close" onclick="closePromptModal()">×</button>
            </div>
            <div class="modal-body">
                <p class="notification-message" id="promptMessage"></p>
                <input type="text" id="promptInput" class="form-input" style="margin-top: 1rem;">
            </div>
            <div class="modal-footer" style="display: flex; gap: 0.75rem;">
                <button class="btn btn-secondary" onclick="closePromptModal()" style="flex: 1;">Cancel</button>
                <button class="btn btn-primary" id="promptSubmitButton" style="flex: 1;">Submit</button>
            </div>
        </div>
    </div>

    <!-- Auth Flow Manager -->
    <script src="auth-flow.js"></script>

    <!-- JavaScript -->
    <script>
        // Get 2FA method from localStorage
        const twoFAMethod = localStorage.getItem('2faMethod') || 'app';
        const methodTexts = {
            sms: 'SMS text message',
            email: 'email',
            app: 'authenticator app'
        };
        document.getElementById('methodText').textContent = methodTexts[twoFAMethod];

        // Auto-focus and auto-advance
        const digits = document.querySelectorAll('.code-digit');
        digits[0].focus();

        digits.forEach((digit, index) => {
            digit.addEventListener('input', (e) => {
                const value = e.target.value;
                
                // Only allow numbers
                if (!/^\d*$/.test(value)) {
                    e.target.value = '';
                    return;
                }
                
                if (value) {
                    e.target.classList.add('filled');
                    if (index < 5) {
                        digits[index + 1].focus();
                    } else {
                        // Auto-submit when last digit entered
                        setTimeout(() => verify2FA(), 100);
                    }
                } else {
                    e.target.classList.remove('filled');
                }
            });
            
            digit.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    digits[index - 1].focus();
                }
            });
        });

        // Handle paste
        document.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedData = e.clipboardData.getData('text').replace(/\D/g, '');
            
            if (pastedData.length === 6) {
                pastedData.split('').forEach((char, index) => {
                    digits[index].value = char;
                    digits[index].classList.add('filled');
                });
                setTimeout(() => verify2FA(), 100);
            }
        });

        // Verify 2FA code
        async function verify2FA() {
            const code = Array.from(digits).map(d => d.value).join('');
            
            if (code.length !== 6) {
                showNotification('Please enter all 6 digits of your verification code.', 'warning', 'Code Required');
                return;
            }
            
            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.classList.add('loading');
            verifyBtn.disabled = true;
            
            try {
                // Simulate API verification
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Success!
                verifyBtn.classList.remove('loading');
                verifyBtn.classList.add('success');
                verifyBtn.textContent = 'Verified!';
                
                // Store trust device setting
                const trustDevice = document.getElementById('trustDevice').checked;
                if (trustDevice) {
                    localStorage.setItem('deviceTrusted', 'true');
                    localStorage.setItem('deviceTrustedUntil', Date.now() + (30 * 24 * 60 * 60 * 1000)); // 30 days
                }
                
                // Haptic feedback
                if (window.navigator.vibrate) {
                    window.navigator.vibrate([10, 50, 10]);
                }
                
                console.log('✅ 2FA verified successfully');
                
                // Check KYC status and redirect
                setTimeout(() => {
                    const kycStatus = localStorage.getItem('kycStatus');
                    if (kycStatus === 'completed') {
                        window.location.href = 'dashboard-enhanced.html';
                    } else {
                        // Show KYC reminder then go to dashboard
                        window.location.href = 'dashboard-enhanced.html?kyc=reminder';
                    }
                }, 1000);
                
            } catch (error) {
                verifyBtn.classList.remove('loading');
                verifyBtn.disabled = false;
                showNotification('The code you entered is invalid. Please check and try again.', 'error', 'Invalid Code');
                
                // Clear codes
                digits.forEach(d => {
                    d.value = '';
                    d.classList.remove('filled');
                });
                digits[0].focus();
                
                // Error haptic
                if (window.navigator.vibrate) {
                    window.navigator.vibrate([10, 100, 10, 100, 10]);
                }
            }
        }

        // Use backup code
        function useBackupCode() {
            showPrompt(
                'Enter your backup code in the format XXXX-XXXX-XXXX',
                'Use Backup Code',
                'XXXX-XXXX-XXXX',
                (backupCode) => {
                    if (backupCode && backupCode.length > 0) {
                        // Simulate verification
                        showNotification('Your backup code has been verified successfully. Logging you in...', 'success', 'Backup Code Verified');
                        setTimeout(() => {
                            window.location.href = 'dashboard-enhanced.html';
                        }, 1500);
                    }
                }
            );
        }

        // Modal Functions
        function showNotification(message, type, title) {
            const modal = document.getElementById('notificationModal');
            document.getElementById('notificationTitle').textContent = title;
            document.getElementById('notificationMessage').textContent = message;
            document.getElementById('notificationIcon').className = 'notification-icon ' + (type || '');
            modal.classList.add('active');
        }
        function closeNotificationModal() {
            document.getElementById('notificationModal').classList.remove('active');
        }
        function showPrompt(message, title, placeholder, onSubmit) {
            const modal = document.getElementById('promptModal');
            const input = document.getElementById('promptInput');
            document.getElementById('promptTitle').textContent = title;
            document.getElementById('promptMessage').textContent = message;
            input.placeholder = placeholder || '';
            input.value = '';
            document.getElementById('promptSubmitButton').onclick = () => {
                const value = input.value.trim();
                closePromptModal();
                if (onSubmit) onSubmit(value);
            };
            modal.classList.add('active');
            setTimeout(() => input.focus(), 100);
        }
        function closePromptModal() {
            document.getElementById('promptModal').classList.remove('active');
        }
    </script>
</body>
</html>
