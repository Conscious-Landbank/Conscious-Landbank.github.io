<!-- @dsCard group="Colors" viewport="700x170" subtitle="On-chain proof & attestation — distinct from money-green" name="Verified Teal (proof)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{padding:22px;background:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .sw{width:150px;border-radius:14px;border:1px solid var(--border-subtle);overflow:hidden}
  .chip{height:64px}
  .meta{padding:9px 12px}
  .nm{font-size:.78rem;font-weight:700;color:var(--text-primary)}
  .hx{font-size:.7rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em}
  .uses{display:flex;flex-direction:column;gap:10px}
  .vbadge{display:inline-flex;align-items:center;gap:.35rem;background:var(--verify-teal-bg);color:var(--verify-teal);border-radius:980px;padding:.3rem .7rem;font-size:.78rem;font-weight:700;width:max-content}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--verify-teal)}
  .cap{font-size:.72rem;color:var(--text-secondary)}
</style></head>
<body>
  <div class="sw"><div class="chip" style="background:var(--verify-teal)"></div><div class="meta"><div class="nm">Verified Teal</div><div class="hx">#127c72</div></div></div>
  <div class="uses">
    <span class="vbadge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg> Verified on-chain</span>
    <span class="vbadge"><span class="dot"></span> PoR service · Operational</span>
    <span class="cap">Proof never reads as profit — teal is reserved for attestation, not P&amp;L.</span>
  </div>
</body></html>
