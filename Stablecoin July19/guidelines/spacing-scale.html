<!-- @dsCard group="Spacing" viewport="700x160" subtitle="4-based spacing scale" name="Scale" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{padding:24px;background:#fff;display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;gap:14px}
  .bar{height:16px;background:var(--brand-deep-blue);border-radius:4px}
  .nm{font-size:.7rem;color:var(--text-secondary);font-weight:600;width:90px;font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="row"><span class="nm">1 · 4px</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="nm">2 · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="nm">3 · 12px</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="nm">4 · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="nm">6 · 24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="nm">8 · 32px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="nm">12 · 48px</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="nm">16 · 64px</span><div class="bar" style="width:64px"></div></div>
</body></html>
