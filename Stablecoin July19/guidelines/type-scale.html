<!-- @dsCard group="Type" viewport="700x300" subtitle="Type scale — page title down to eyebrow" name="Scale" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{padding:24px;background:#fff;color:var(--text-primary)}
  .line{display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px solid var(--border-subtle)}
  .line:last-child{border:none}
  .tk{font-size:.66rem;color:var(--text-secondary);width:96px;flex-shrink:0;font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.05em}
  .sp{font-family:var(--font-display);color:var(--brand-deep-blue);font-weight:700;line-height:1.1}
</style></head>
<body>
  <div class="line"><span class="tk">4xl · 44</span><span class="sp" style="font-size:2.75rem">Hero</span></div>
  <div class="line"><span class="tk">3xl · 32</span><span class="sp" style="font-size:2rem">Page title</span></div>
  <div class="line"><span class="tk">2xl · 24</span><span class="sp" style="font-size:1.5rem">Section title</span></div>
  <div class="line"><span class="tk">xl · 20</span><span class="sp" style="font-size:1.25rem;font-weight:600">Modal title</span></div>
  <div class="line"><span class="tk">base · 16</span><span class="sp" style="font-size:1rem;font-weight:400;color:var(--text-primary)">Body & inputs</span></div>
  <div class="line"><span class="tk">sm · 14</span><span class="sp" style="font-size:.875rem;font-weight:400;color:var(--text-secondary)">Secondary / dense UI</span></div>
  <div class="line"><span class="tk">xs · 12</span><span class="sp" style="font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--text-secondary)">EYEBROW / NAV</span></div>
</body></html>
