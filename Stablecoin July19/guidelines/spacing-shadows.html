<!-- @dsCard group="Spacing" viewport="700x190" subtitle="Soft, blue-tinted ladder — card → hover → menu → modal" name="Shadows" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{padding:30px;background:#fff;display:flex;gap:28px;flex-wrap:wrap;align-items:center}
  .item{text-align:center}
  .box{width:120px;height:78px;background:#fff;border-radius:16px;border:1px solid var(--border-subtle);margin-bottom:10px}
  .nm{font-size:.7rem;color:var(--text-secondary);font-weight:600}
</style></head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-card)"></div><div class="nm">card (resting)</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-hover)"></div><div class="nm">hover lift</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-menu)"></div><div class="nm">menu / popover</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-modal)"></div><div class="nm">modal</div></div>
</body></html>
