<!-- @dsCard group="Colors" viewport="700x150" subtitle="Teal-tinted neutral ramp — never flat grey" name="Neutral ramp" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{padding:22px;background:#fff}
  .ramp{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--border-subtle)}
  .step{flex:1;height:70px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:.62rem;font-weight:600}
</style></head>
<body>
  <div class="ramp">
    <div class="step" style="background:var(--neutral-900);color:#fff">900</div>
    <div class="step" style="background:var(--neutral-800);color:#fff">800</div>
    <div class="step" style="background:var(--neutral-700);color:#fff">700</div>
    <div class="step" style="background:var(--neutral-600);color:#fff">600</div>
    <div class="step" style="background:var(--neutral-500);color:#173d47">500</div>
    <div class="step" style="background:var(--neutral-400);color:#173d47">400</div>
    <div class="step" style="background:var(--neutral-300);color:#173d47">300</div>
    <div class="step" style="background:var(--neutral-200);color:#173d47">200</div>
    <div class="step" style="background:var(--neutral-100);color:#173d47">100</div>
  </div>
</body></html>
